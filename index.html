<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symmetry Pro | V20 Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0c; --card: #1c1c21; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.1); --text: #f0f0f0; --gray: #999;
            --accent: #25252b; --red: #ff4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 90px; }
        h1, h2, h3, .logo { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: rgba(10,10,12,0.9); backdrop-filter: blur(15px); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; justify-content: space-between; }
        .menu-icon { font-size: 28px; color: var(--neon); cursor: pointer; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); z-index: 200; transition: 0.4s; border-right: 1px solid #333; padding: 100px 30px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 20px 0; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 1px solid #2a2a2a; }

        .card-ejercicio { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .ej-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px; }
        .ej-name { color: var(--neon); font-family: 'Orbitron'; font-size: 0.85rem; font-weight: 700; }
        
        .btn-s { background: #2a2a30; border: 1px solid #444; color: var(--text); width: 34px; height: 34px; border-radius: 10px; font-weight: bold; }

        .serie-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 12px; margin-bottom: 15px; align-items: center; }
        .serie-num { color: var(--gray); font-weight: 800; font-size: 0.75rem; font-family: 'Orbitron'; }
        
        input { background: var(--accent); border: 1px solid #3a3a40; border-radius: 10px; color: #fff; text-align: center; font-size: 1.1rem; padding: 12px 5px; width: 100%; font-weight: 600; }
        
        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 20px; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-family: 'Orbitron'; font-size: 0.9rem; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 8px; background: #25252b; color: #666; }
        .day-trained { background: var(--neon) !important; color: #000 !important; font-weight: bold; }

        .hidden { display: none; }
        .back-btn { color: var(--gray); cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.75rem; font-weight: 700; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 150; display: none; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div class="logo" style="color:var(--neon);">SYMMETRY PRO</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 PROGRESO</div>
        <div class="sidebar-item" onclick="changeView('calendar')">📅 DISCIPLINA</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 RUTINAS</div>
        <div class="sidebar-item" onclick="changeView('goals')">🎯 OBJETIVOS</div>
        <div class="sidebar-item" onclick="resetData()" style="color:var(--red);">⚠ RESET</div>
    </div>

    <div id="view-charts">
        <canvas id="radarMusculos" style="margin-bottom:30px;"></canvas>
        <canvas id="lineProgress"></canvas>
    </div>

    <div id="view-calendar" class="hidden">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="btn-main" style="margin:0; background:#222; color:var(--gray);" onclick="setCalView('month')">MES</button>
            <button class="btn-main" style="margin:0; background:#222; color:var(--gray);" onclick="setCalView('year')">AÑO</button>
        </div>
        <div id="cal-month-box" class="card-ejercicio">
            <div id="monthLabel" style="text-align:center; color:var(--neon); margin-bottom:15px; font-family:'Orbitron';"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div id="cal-year-box" class="card-ejercicio hidden"><div id="yearContainer" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;"></div></div>
    </div>

    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER</span>
        <h2 id="day-title-header" style="color:var(--neon);"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarTotal()">GUARDAR Y SINCRONIZAR</button>
    </div>

    <div id="view-goals" class="hidden">
        <h2>Objetivos Fuerza (1RM)</h2>
        <div id="goals-list"></div>
        <button class="btn-main" onclick="saveGoals()">GUARDAR OBJETIVOS</button>
    </div>

    <div id="view-groups" class="hidden"><h2>Bloques</h2><div id="groups-container"></div><button class="btn-main" onclick="nuevaSemana()">+ NUEVA SEMANA</button></div>
    <div id="view-weeks" class="hidden"><span class="back-btn" onclick="showView('groups')">← VOLVER</span><div id="semanas-container"></div></div>
    <div id="view-days" class="hidden"><span class="back-btn" onclick="showView('weeks')">← VOLVER</span><div id="dias-container"></div></div>

<script>
const musculos = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
const rutinaMaestraOriginal = [
    { n: 'Push 1', e: [{name:'Press Inclinado',m:'Pecho',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Aperturas Inclinado',m:'Pecho',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Curl Biceps Inclinado',m:'Biceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Curl Martillo',m:'Biceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Elevaciones Laterales',m:'Hombro',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Press Militar',m:'Hombro',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}]},
    { n: 'Pull 1', e: [{name:'Dominadas',m:'Espalda',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Remo Unilateral',m:'Espalda',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Elevaciones Posteriores',m:'Hombro',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Press Cerrado',m:'Triceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Press Frances',m:'Triceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Dragon Flags',m:'Core',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}]},
    { n: 'Legs', e: [{name:'Sentadilla Bulgara',m:'Pierna',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Sentadilla',m:'Pierna',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Peso Muerto Manc.',m:'Pierna',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Curl Femoral',m:'Pierna',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Gemelos Pie',m:'Pierna',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Gemelos Sentado',m:'Pierna',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}]},
    { n: 'Push 2', e: [{name:'Press Inclinado',m:'Pecho',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Aperturas Inclinado',m:'Pecho',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Curl Biceps Inclinado',m:'Biceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Curl Martillo',m:'Biceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Elevaciones Laterales',m:'Hombro',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Press Militar',m:'Hombro',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}]},
    { n: 'Pull 2', e: [{name:'Dominadas',m:'Espalda',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Remo Unilateral',m:'Espalda',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Elevaciones Posteriores',m:'Hombro',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Press Cerrado',m:'Triceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Press Frances',m:'Triceps',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}, {name:'Dragon Flags',m:'Core',series:[{p:0,r:0},{p:0,r:0},{p:0,r:0}]}]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV22')) || { semanas: [], rutinaMaestra: rutinaMaestraOriginal, objetivosEjercicios: {}, fechasEntreno: [] };
let activeW = null, activeD = null, radarChart, lineChart, currentCalDate = new Date();

function save() { localStorage.setItem('gymNeonV22', JSON.stringify(db)); updateCharts(); }

function renderEjercicios() {
    const dia = db.semanas[activeW].dias[activeD];
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card-ejercicio">
            <div class="ej-header"><span class="ej-name">${ej.name}</span><div style="display:flex; gap:5px;"><button class="btn-s" onclick="removeSerie(${ei})">-</button><button class="btn-s" onclick="addSerie(${ei})">+</button></div></div>
            ${ej.series.map((s, si) => `<div class="serie-row"><div class="serie-num">S${si+1}</div><input type="number" step="0.5" value="${s.p}" onchange="updVal(${ei},${si},'p',this.value)"><input type="number" value="${s.r}" onchange="updVal(${ei},${si},'r',this.value)"></div>`).join('')}
        </div>`).join('');
}

function updVal(ei, si, f, v) { db.semanas[activeW].dias[activeD].e[ei].series[si][f] = parseFloat(v) || 0; }
function addSerie(ei) { db.semanas[activeW].dias[activeD].e[ei].series.push({p:0,r:0}); renderEjercicios(); }
function removeSerie(ei) { if(db.semanas[activeW].dias[activeD].e[ei].series.length > 1) { db.semanas[activeW].dias[activeD].e[ei].series.pop(); renderEjercicios(); } }

function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipoRaiz = diaEditado.n.split(' ')[0]; // Detecta "Push", "Pull" o "Legs"
    db.rutinaMaestra[activeD] = JSON.parse(JSON.stringify(diaEditado));
    const hoy = new Date().toISOString().split('T')[0];
    if(!db.fechasEntreno.includes(hoy)) db.fechasEntreno.push(hoy);

    db.semanas.forEach((sem, sIdx) => {
        sem.dias.forEach(dia => {
            if (dia.n.startsWith(tipoRaiz) && sIdx >= activeW) {
                dia.e.forEach(ejF => {
                    const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                    if(ejActual) ejF.series = JSON.parse(JSON.stringify(ejActual.series));
                });
            }
        });
    });
    save(); showView('days');
}

function renderGoals() {
    const ejs = [];
    rutinaMaestraOriginal.forEach(d => d.e.forEach(e => { if(!ejs.includes(e.name)) ejs.push(e.name); }));
    document.getElementById('goals-list').innerHTML = ejs.map(name => `
        <div class="card-ejercicio" style="padding:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.8rem; font-family:'Orbitron';">${name}</span>
            <input type="number" id="goal-${name}" style="width:80px; padding:8px;" value="${db.objetivosEjercicios[name] || 0}">
        </div>`).join('');
}

function saveGoals() {
    const ejs = [];
    rutinaMaestraOriginal.forEach(d => d.e.forEach(e => { if(!ejs.includes(e.name)) ejs.push(e.name); }));
    ejs.forEach(name => { db.objetivosEjercicios[name] = parseFloat(document.getElementById('goal-'+name).value) || 0; });
    save(); alert("Objetivos actualizados");
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').style.display = document.getElementById('overlay').style.display === 'block' ? 'none' : 'block'; }
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); if(v === 'calendar') renderCalendar(); if(v === 'goals') renderGoals(); toggleSidebar(); }
function showView(id) { document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden')); document.getElementById('view-' + id).classList.remove('hidden'); if(id === 'charts') updateCharts(); }
function renderGroups() {
    const cont = document.getElementById('groups-container');
    cont.innerHTML = "";
    for(let i=0; i<Math.ceil(db.semanas.length/12); i++) cont.innerHTML += `<div class="card-ejercicio" onclick="renderWInG(${i})">BLOQUE ${i+1} (Sem ${i*12+1}-${Math.min((i+1)*12, db.semanas.length)})</div>`;
}
function nuevaSemana() { db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) }); save(); renderGroups(); }
function renderWInG(gi) {
    let h = "";
    for(let i=gi*12; i<Math.min((gi+1)*12, db.semanas.length); i++) h += `<div class="card-ejercicio" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h; showView('weeks');
}
function openW(i) { activeW = i; document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card-ejercicio" onclick="openD(${di})">${d.n}</div>`).join(''); showView('days'); }
function openD(di) { activeD = di; document.getElementById('day-title-header').innerText = db.semanas[activeW].dias[activeD].n; renderEjercicios(); showView('exercises'); }

function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = "";
    const y = currentCalDate.getFullYear(), m = currentCalDate.getMonth();
    document.getElementById('monthLabel').innerText = (m+1) + " / " + y;
    const first = (new Date(y, m, 1).getDay() || 7) - 1;
    for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
    for(let d=1; d<=new Date(y, m+1, 0).getDate(); d++) {
        const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        grid.innerHTML += `<div class="calendar-day ${db.fechasEntreno.includes(dStr) ? 'day-trained' : ''}">${d}</div>`;
    }
}
function updateCharts() {
    const ctxR = document.getElementById('radarMusculos');
    const dataR = musculos.map(m => {
        let maxs = [];
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(ej => {
            if(ej.m === m) {
                let m1 = 0; ej.series.forEach(ser => { let r1 = ser.p * (1 + ser.r/30); if(r1 > m1) m1 = r1; });
                if(db.objetivosEjercicios[ej.name]) maxs.push((m1/db.objetivosEjercicios[ej.name])*100);
            }
        })));
        return maxs.length ? Math.min(maxs.reduce((a,b)=>a+b)/maxs.length, 100) : 0;
    });
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctxR, { type:'radar', data:{ labels:musculos, datasets:[{data:dataR, borderColor:'#39ff14', backgroundColor:'rgba(57,255,20,0.2)', borderWidth:2}] }, options:{ scales:{r:{min:0,max:100,grid:{color:'#333'},angleLines:{color:'#333'},pointLabels:{color:'#aaa'},ticks:{display:false}}}, plugins:{legend:{display:false}} }});
}
function resetData() { if(confirm("¿RESET TOTAL?")) { localStorage.removeItem('gymNeonV22'); location.reload(); } }

if(db.semanas.length === 0) nuevaSemana();
updateCharts(); renderGroups(); renderCalendar();
</script>
</body>
</html>
