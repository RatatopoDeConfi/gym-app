<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Neon Unified</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #050505; --card: #0f0f0f; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.2); --text: #ffffff; --gray: #666;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 70px; }
        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; }
        .menu-icon { font-size: 28px; color: var(--neon); cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #0a0a0a; z-index: 200; transition: 0.3s; border-right: 1px solid var(--neon); padding: 60px 20px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 15px 0; font-weight: bold; color: var(--text); text-transform: uppercase; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
        .card { background: var(--card); border: 1px solid #222; padding: 18px; border-radius: 8px; margin-bottom: 15px; }
        .ejercicio-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        input { width: 55px; background: transparent; border: none; border-bottom: 1px solid var(--gray); color: var(--neon); text-align: center; font-size: 1rem; outline: none; }
        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .hidden { display: none; }
        .back-btn { color: var(--neon); cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div style="margin-left: 20px; font-weight: 800; letter-spacing: 2px; font-size: 0.9rem;">SYMMETRY NEON</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 Radar</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 Mis Bloques</div>
        <div class="sidebar-item" onclick="toggleSidebar()">Cerrar</div>
    </div>

    <div id="view-charts">
        <h2>Estatus Muscular</h2>
        <canvas id="radarMusculos"></canvas>
    </div>

    <div id="view-groups" class="hidden">
        <h2>Bloques (12 Semanas)</h2>
        <div id="groups-container"></div>
        <button class="btn-main" onclick="nuevaSemana()">+ CREAR NUEVA SEMANA</button>
    </div>

    <div id="view-weeks" class="hidden">
        <span class="back-btn" onclick="showView('groups')">← VOLVER</span>
        <div id="semanas-container"></div>
    </div>

    <div id="view-days" class="hidden">
        <span class="back-btn" onclick="showView('weeks')">← VOLVER</span>
        <div id="dias-container"></div>
    </div>

    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER</span>
        <h2 id="day-title-header"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarTotal()">✓ GUARDAR Y ACTUALIZAR SIGUIENTES</button>
    </div>

<script>
const rutinaMaestraInicial = [
    { n: 'Push 1', e: [{ name: 'Press Inclinado', m: 'Pecho', p: 0, r: 0, s: 3 }, { name: 'Aperturas Inclinado', m: 'Pecho', p: 0, r: 0, s: 3 }, { name: 'Curl Biceps Inclinado', m: 'Biceps', p: 0, r: 0, s: 3 }, { name: 'Curl Martillo', m: 'Biceps', p: 0, r: 0, s: 3 }, { name: 'Elevaciones Laterales', m: 'Hombro', p: 0, r: 0, s: 3 }, { name: 'Press Militar', m: 'Hombro', p: 0, r: 0, s: 3 }]},
    { n: 'Pull 1', e: [{ name: 'Dominadas', m: 'Espalda', p: 0, r: 0, s: 3 }, { name: 'Remo Unilateral', m: 'Espalda', p: 0, r: 0, s: 3 }, { name: 'Elevaciones Posteriores', m: 'Hombro', p: 0, r: 0, s: 3 }, { name: 'Press Cerrado', m: 'Triceps', p: 0, r: 0, s: 3 }, { name: 'Press Frances', m: 'Triceps', p: 0, r: 0, s: 3 }, { name: 'Dragon Flags', m: 'Core', p: 0, r: 0, s: 3 }]},
    { n: 'Legs', e: [{ name: 'Sentadilla Bulgara', m: 'Pierna', p: 0, r: 0, s: 3 }, { name: 'Sentadilla', m: 'Pierna', p: 0, r: 0, s: 3 }, { name: 'Peso Muerto Manc.', m: 'Pierna', p: 0, r: 0, s: 3 }, { name: 'Curl Femoral', m: 'Pierna', p: 0, r: 0, s: 3 }, { name: 'Gemelos Pie', m: 'Pierna', p: 0, r: 0, s: 3 }, { name: 'Gemelos Sentado', m: 'Pierna', p: 0, r: 0, s: 3 }]},
    { n: 'Push 2', e: [{ name: 'Press Inclinado', m: 'Pecho', p: 0, r: 0, s: 3 }, { name: 'Aperturas Inclinado', m: 'Pecho', p: 0, r: 0, s: 3 }, { name: 'Curl Biceps Inclinado', m: 'Biceps', p: 0, r: 0, s: 3 }, { name: 'Curl Martillo', m: 'Biceps', p: 0, r: 0, s: 3 }, { name: 'Elevaciones Laterales', m: 'Hombro', p: 0, r: 0, s: 3 }, { name: 'Press Militar', m: 'Hombro', p: 0, r: 0, s: 3 }]},
    { n: 'Pull 2', e: [{ name: 'Dominadas', m: 'Espalda', p: 0, r: 0, s: 3 }, { name: 'Remo Unilateral', m: 'Espalda', p: 0, r: 0, s: 3 }, { name: 'Elevaciones Posteriores', m: 'Hombro', p: 0, r: 0, s: 3 }, { name: 'Press Cerrado', m: 'Triceps', p: 0, r: 0, s: 3 }, { name: 'Press Frances', m: 'Triceps', p: 0, r: 0, s: 3 }, { name: 'Dragon Flags', m: 'Core', p: 0, r: 0, s: 3 }]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV8')) || { semanas: [], rutinaMaestra: rutinaMaestraInicial };
let activeW = null, activeD = null;

function save() { localStorage.setItem('gymNeonV8', JSON.stringify(db)); updateRadar(); }

function nuevaSemana() {
    db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) });
    save(); renderGroups();
}

function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipoDia = diaEditado.n.split(' ')[0]; // Detecta "Push", "Pull" o "Legs"

    // 1. Actualizar TODOS los días de este tipo en la PLANTILLA MAESTRA
    db.rutinaMaestra.forEach(dMaestro => {
        if(dMaestro.n.startsWith(tipoDia)) {
            dMaestro.e.forEach(ejM => {
                const ejEditado = diaEditado.e.find(ex => ex.name === ejM.name);
                if(ejEditado) { ejM.p = ejEditado.p; ejM.r = ejEditado.r; ejM.s = ejEditado.s; }
            });
        }
    });

    // 2. PROPAGAR A SESIONES FUTURAS (Misma semana o siguientes)
    for (let i = activeW; i < db.semanas.length; i++) {
        db.semanas[i].dias.forEach((dFuturo, dfIdx) => {
            // Solo si es un paso adelante en el tiempo
            if (i > activeW || (i === activeW && dfIdx > activeD)) {
                if (dFuturo.n.startsWith(tipoDia)) {
                    dFuturo.e.forEach(ejF => {
                        const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                        if(ejActual) { ejF.p = ejActual.p; ejF.r = ejActual.r; ejF.s = ejActual.s; }
                    });
                }
            }
        });
    }
    
    save();
    alert(`¡Datos de ${tipoDia} sincronizados para todas las próximas sesiones!`);
    showView('days');
}

// RESTO DE FUNCIONES (Navegación y Render)
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    const over = document.getElementById('overlay');
    over.style.display = over.style.display === 'block' ? 'none' : 'block';
}
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); toggleSidebar(); }
function showView(id) {
    document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden'));
    document.getElementById('view-' + id).classList.remove('hidden');
}
function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = "";
    for(let i=0; i<nG; i++) {
        cont.innerHTML += `<div class="card" onclick="renderWInG(${i})"><span style="color:var(--neon); font-size:0.7rem; border:1px solid var(--neon); padding:2px 4px;">BLOQUE ${i+1}</span><br><br>Sem. ${i*12+1} - ${Math.min((i+1)*12, db.semanas.length)}</div>`;
    }
}
function renderWInG(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}
function openW(i) {
    activeW = i;
    document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card" onclick="openD(${di})">${d.n}</div>`).join('');
    showView('days');
}
function openD(di) {
    activeD = di;
    const dia = db.semanas[activeW].dias[di];
    document.getElementById('day-title-header').innerText = dia.n;
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card">
            <strong style="color:var(--neon)">${ej.name}</strong>
            <div class="ejercicio-row">
                <div><span style="font-size:0.7rem; color:#666; display:block">PESO</span><input type="number" value="${ej.p}" onchange="upd(${ei},'p',this.value)"></div>
                <div><span style="font-size:0.7rem; color:#666; display:block">REPS</span><input type="number" value="${ej.r}" onchange="upd(${ei},'r',this.value)"></div>
                <div><span style="font-size:0.7rem; color:#666; display:block">SETS</span><input type="number" value="${ej.s}" onchange="upd(${ei},'s',this.value)"></div>
            </div>
        </div>
    `).join('');
    showView('exercises');
}
function upd(ei, f, v) { db.semanas[activeW].dias[activeD].e[ei][f] = parseFloat(v); }

let chart;
function updateRadar() {
    const ctx = document.getElementById('radarMusculos');
    const labels = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
    const data = labels.map(m => {
        let max = 0;
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(e => {
            if(e.m === m) { let sc = (e.p * e.r)/2; if(sc > max) max = sc; }
        })));
        return Math.min(max, 100);
    });
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'radar',
        data: { labels, datasets: [{ data, backgroundColor: 'rgba(57, 255, 20, 0.1)', borderColor: '#39ff14', borderWidth: 2 }] },
        options: { scales: { r: { grid: { color: '#222' }, angleLines: { color: '#222' }, pointLabels: { color: '#888' }, ticks: { display: false }, suggestMax: 100 } }, plugins: { legend: { display: false } } }
    });
}
updateRadar();
renderGroups();
</script>
</body>
</html>
