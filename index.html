<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symmetry Pro | V22</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --card: #1c1c21; --neon: #39ff14; --text: #f0f0f0; --gray: #999; --accent: #25252b; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 90px; }
        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: rgba(10,10,12,0.9); backdrop-filter: blur(15px); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; justify-content: space-between; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); z-index: 200; transition: 0.4s; padding: 100px 30px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 20px 0; color: var(--gray); cursor: pointer; border-bottom: 1px solid #2a2a2a; font-family: 'Orbitron'; font-size: 0.8rem; }
        .card-ejercicio { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 16px; margin-bottom: 25px; }
        .ej-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .ej-name { color: var(--neon); font-family: 'Orbitron'; font-size: 0.8rem; }
        .serie-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .input-group { position: relative; }
        .input-group span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.6rem; color: #555; }
        input { background: var(--accent); border: 1px solid #3a3a40; border-radius: 8px; color: #fff; text-align: center; padding: 10px; width: 100%; font-weight: bold; }
        .btn-main { width: 100%; background: var(--neon); color: #000; padding: 18px; border-radius: 12px; font-weight: 800; border: none; font-family: 'Orbitron'; cursor: pointer; }
        .hidden { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; display: none; }
        .back-btn { color: var(--gray); cursor: pointer; display: block; margin-bottom: 15px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div onclick="toggleSidebar()" style="color:var(--neon); font-size: 24px; cursor:pointer;">☰</div>
        <div style="font-family:'Orbitron'; color:var(--neon);">SYMMETRY PRO</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 PROGRESO</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 RUTINAS</div>
        <div class="sidebar-item" onclick="changeView('goals')">🎯 OBJETIVOS</div>
        <div class="sidebar-item" onclick="resetData()" style="color:var(--red);">⚠ REINICIAR TODO</div>
    </div>

    <div id="view-groups" class="hidden">
        <h2 style="font-family:'Orbitron'">BLOQUES</h2>
        <div id="groups-container"></div>
        <button class="btn-main" onclick="nuevaSemana()">+ NUEVA SEMANA</button>
    </div>

    <div id="view-weeks" class="hidden">
        <span class="back-btn" onclick="showView('groups')">← VOLVER</span>
        <div id="semanas-container"></div>
    </div>

    <div id="view-days" class="hidden">
        <span class="back-btn" onclick="showView('weeks')">← VOLVER</span>
        <div id="dias-container"></div>
    </div>

    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER</span>
        <h2 id="day-title" style="color:var(--neon); font-family:'Orbitron';"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagar()">GUARDAR SESIÓN</button>
    </div>

    <div id="view-goals" class="hidden">
        <h2 style="font-family:'Orbitron'">OBJETIVOS</h2>
        <div id="goals-list"></div>
        <button class="btn-main" onclick="saveGoals()">GUARDAR OBJETIVOS</button>
    </div>

    <div id="view-charts">
        <canvas id="radarMusculos" style="margin-bottom:30px;"></canvas>
    </div>

<script>
const rutinaBase = [
    { n: 'Push 1', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 1', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Legs', e: [
        { name: 'Sentadilla Bulgara', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Sentadilla', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Peso Muerto Manc.', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Femoral', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Pie', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Push 2', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 2', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]}
];

let db = JSON.parse(localStorage.getItem('gymSlimV22')) || { semanas: [], rutinaMaestra: JSON.parse(JSON.stringify(rutinaBase)), objetivos: {} };
let actW = null, actD = null;
let radarChart;

function save() { localStorage.setItem('gymSlimV22', JSON.stringify(db)); updateRadar(); }

function nuevaSemana() {
    db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) });
    save(); renderGroups();
}

function finalizarYPropagar() {
    const diaEditado = db.semanas[actW].dias[actD];
    const tipo = diaEditado.n.split(' ')[0];

    db.rutinaMaestra.forEach(rmD => {
        if(rmD.n.startsWith(tipo)) {
            rmD.e.forEach(ejM => {
                const ejE = diaEditado.e.find(x => x.name === ejM.name);
                if(ejE) ejM.series = JSON.parse(JSON.stringify(ejE.series));
            });
        }
    });

    db.semanas.forEach((sem, sIdx) => {
        if(sIdx >= actW) {
            sem.dias.forEach(dia => {
                if(dia.n.startsWith(tipo)) {
                    dia.e.forEach(ejF => {
                        const ejE = diaEditado.e.find(x => x.name === ejF.name);
                        if(ejE) ejF.series = JSON.parse(JSON.stringify(ejE.series));
                    });
                }
            });
        }
    });
    save();
    showView('days');
}

function renderEjercicios() {
    const d = db.semanas[actW].dias[actD];
    document.getElementById('day-title').innerText = d.n;
    document.getElementById('ejercicios-container').innerHTML = d.e.map((ej, ei) => `
        <div class="card-ejercicio">
            <div class="ej-header"><span class="ej-name">${ej.name}</span></div>
            ${ej.series.map((s, si) => `
                <div class="serie-row">
                    <div style="font-size:0.6rem; color:#666">S${si+1}</div>
                    <div class="input-group"><input type="number" step="0.5" value="${s.p}" onchange="db.semanas[${actW}].dias[${actD}].e[${ei}].series[${si}].p=parseFloat(this.value)||0"><span>kg</span></div>
                    <div class="input-group"><input type="number" value="${s.r}" onchange="db.semanas[${actW}].dias[${actD}].e[${ei}].series[${si}].r=parseFloat(this.value)||0"><span>reps</span></div>
                </div>
            `).join('')}
        </div>`).join('');
}

function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = "";
    for(let i=0; i<nG; i++) {
        cont.innerHTML += `<div class="card-ejercicio" onclick="renderW(${i})">BLOQUE ${i+1} (Semanas ${i*12+1}-${Math.min((i+1)*12, db.semanas.length)})</div>`;
    }
}

function renderW(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card-ejercicio" onclick="actW=${i}; renderD()">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}

function renderD() {
    document.getElementById('dias-container').innerHTML = db.semanas[actW].dias.map((d, di) => `<div class="card-ejercicio" onclick="actD=${di}; renderEjercicios(); showView('exercises')">${d.n}</div>`).join('');
    showView('days');
}

function renderGoals() {
    const nms = []; rutinaBase.forEach(d => d.e.forEach(e => { if(!nms.includes(e.name)) nms.push(e.name); }));
    document.getElementById('goals-list').innerHTML = nms.map(n => `
        <div class="card-ejercicio" style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.7rem">${n}</span>
            <input type="number" id="g-${n}" style="width:80px" value="${db.objetivos[n] || 0}">
        </div>`).join('');
}

function saveGoals() {
    const nms = []; rutinaBase.forEach(d => d.e.forEach(e => { if(!nms.includes(e.name)) nms.push(e.name); }));
    nms.forEach(n => db.objetivos[n] = parseFloat(document.getElementById('g-'+n).value) || 0);
    save(); alert("Objetivos Guardados");
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); const o = document.getElementById('overlay'); o.style.display = o.style.display === 'block' ? 'none' : 'block'; }
function changeView(v) { if(v === 'groups') renderGroups(); if(v === 'goals') renderGoals(); showView(v); toggleSidebar(); }
function showView(id) { document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(v => v.classList.add('hidden')); document.getElementById('view-'+id).classList.remove('hidden'); }
function resetData() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('gymSlimV22'); location.reload(); } }

function updateRadar() {
    const ctx = document.getElementById('radarMusculos');
    const musc = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
    const data = musc.map(m => {
        let scores = [];
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(ej => {
            if(ej.m === m) {
                let max = 0; ej.series.forEach(sr => { let r1m = sr.p * (1 + sr.r/30); if(r1m > max) max = r1m; });
                let obj = db.objetivos[ej.name] || 1; scores.push((max/obj)*100);
            }
        })));
        return scores.length ? Math.min(scores.reduce((a,b)=>a+b,0)/scores.length, 100) : 0;
    });
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, { type: 'radar', data: { labels: musc, datasets: [{ data: data, borderColor: '#39ff14', backgroundColor: 'rgba(57,255,20,0.1)' }] }, options: { scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#333' } } }, plugins: { legend: { display: false } } } });
}

if(db.semanas.length === 0) nuevaSemana();
updateRadar();
renderGroups();
</script>
</body>
</html>
