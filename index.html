<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symmetry Pro | Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --card: #1c1c21; --neon: #39ff14; --neon-dim: rgba(57, 255, 20, 0.1); --text: #f0f0f0; --gray: #999; --accent: #25252b; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 90px; }
        h1, h2, h3, .logo { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: rgba(10,10,12,0.9); backdrop-filter: blur(15px); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; justify-content: space-between; }
        .menu-icon { font-size: 28px; color: var(--neon); cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); z-index: 200; transition: 0.4s; border-right: 1px solid #333; padding: 100px 30px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 20px 0; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 1px solid #2a2a2a; }
        .card-ejercicio { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .ej-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .ej-name { color: var(--neon); font-family: 'Orbitron'; font-size: 0.85rem; }
        .serie-row { display: grid; grid-template-columns: 45px 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center; }
        input { background: var(--accent); border: 1px solid #3a3a40; border-radius: 8px; color: #fff; text-align: center; font-size: 1rem; padding: 10px; width: 100%; }
        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-family: 'Orbitron'; }
        .hidden { display: none; }
        .back-btn { color: var(--gray); cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.8rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; border-radius: 5px; background: #25252b; }
        .day-trained { background: var(--neon) !important; color: #000 !important; font-weight: bold; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; display: none; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div class="logo" style="color:var(--neon);">SYMMETRY PRO</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 PROGRESO</div>
        <div class="sidebar-item" onclick="changeView('calendar')">📅 DISCIPLINA</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 RUTINAS</div>
        <div class="sidebar-item" onclick="changeView('goals')">🎯 OBJETIVOS</div>
        <div class="sidebar-item" onclick="resetData()" style="color:var(--red);">⚠ RESET</div>
    </div>

    <div id="view-charts"><canvas id="radarMusculos"></canvas><canvas id="lineProgress" style="margin-top:30px;"></canvas></div>

    <div id="view-calendar" class="hidden">
        <div style="display:flex; gap:10px; margin-bottom:15px;"><button class="btn-main" onclick="setCalView('month')">MES</button><button class="btn-main" onclick="setCalView('year')">AÑO</button></div>
        <div id="cal-month-box" class="card-ejercicio"><div id="monthLabel" style="text-align:center; color:var(--neon); margin-bottom:10px;"></div><div class="calendar-grid" id="calendarGrid"></div></div>
        <div id="cal-year-box" class="card-ejercicio hidden"><div id="yearContainer" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;"></div></div>
    </div>

    <div id="view-groups" class="hidden"><h2>Bloques</h2><div id="groups-container"></div><button class="btn-main" onclick="nuevaSemana()">+ NUEVA SEMANA</button></div>
    <div id="view-weeks" class="hidden"><span class="back-btn" onclick="showView('groups')">← VOLVER</span><div id="semanas-container"></div></div>
    <div id="view-days" class="hidden"><span class="back-btn" onclick="showView('weeks')">← VOLVER</span><div id="dias-container"></div></div>
    
    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER</span>
        <h2 id="day-title-header" style="color:var(--neon);"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarTotal()">GUARDAR Y SINCRONIZAR</button>
    </div>

    <div id="view-goals" class="hidden">
        <h2>Objetivos de Fuerza (1RM)</h2>
        <div id="goals-list"></div>
        <button class="btn-main" onclick="saveGoals()">GUARDAR OBJETIVOS</button>
    </div>

<script>
const musculos = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
const rutinaMaestraOriginal = [
    { n: 'Push 1', e: [{name:'Press Inclinado',m:'Pecho',series:[{p:0,r:0},{p:0,r:0}]}, {name:'Aperturas',m:'Pecho',series:[{p:0,r:0}]}, {name:'Curl Biceps',m:'Biceps',series:[{p:0,r:0}]}, {name:'Curl Martillo',m:'Biceps',series:[{p:0,r:0}]}, {name:'Laterales',m:'Hombro',series:[{p:0,r:0}]}, {name:'Militar',m:'Hombro',series:[{p:0,r:0}]}]},
    { n: 'Pull 1', e: [{name:'Dominadas',m:'Espalda',series:[{p:0,r:0}]}, {name:'Remo',m:'Espalda',series:[{p:0,r:0}]}, {name:'Posteriores',m:'Hombro',series:[{p:0,r:0}]}, {name:'Cerrado',m:'Triceps',series:[{p:0,r:0}]}, {name:'Frances',m:'Triceps',series:[{p:0,r:0}]}]},
    { n: 'Legs', e: [{name:'Bulgara',m:'Pierna',series:[{p:0,r:0}]}, {name:'Sentadilla',m:'Pierna',series:[{p:0,r:0}]}, {name:'Peso Muerto',m:'Pierna',series:[{p:0,r:0}]}, {name:'Gemelos',m:'Pierna',series:[{p:0,r:0}]}]},
    { n: 'Push 2', e: [{name:'Press Inclinado',m:'Pecho',series:[{p:0,r:0}]}, {name:'Aperturas',m:'Pecho',series:[{p:0,r:0}]}, {name:'Curl Biceps',m:'Biceps',series:[{p:0,r:0}]}, {name:'Curl Martillo',m:'Biceps',series:[{p:0,r:0}]}, {name:'Laterales',m:'Hombro',series:[{p:0,r:0}]}, {name:'Militar',m:'Hombro',series:[{p:0,r:0}]}]},
    { n: 'Pull 2', e: [{name:'Dominadas',m:'Espalda',series:[{p:0,r:0}]}, {name:'Remo',m:'Espalda',series:[{p:0,r:0}]}, {name:'Posteriores',m:'Hombro',series:[{p:0,r:0}]}, {name:'Cerrado',m:'Triceps',series:[{p:0,r:0}]}, {name:'Frances',m:'Triceps',series:[{p:0,r:0}]}]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV21')) || { semanas: [], rutinaMaestra: rutinaMaestraOriginal, objetivosEjercicios: {}, fechasEntreno: [] };
let activeW = null, activeD = null, radarChart, lineChart, currentCalDate = new Date(), currentCalView = 'month';

function save() { localStorage.setItem('gymNeonV21', JSON.stringify(db)); updateCharts(); }

function renderEjercicios() {
    const dia = db.semanas[activeW].dias[activeD];
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card-ejercicio">
            <div class="ej-header"><span class="ej-name">${ej.name}</span><div><button onclick="addSerie(${ei})">+</button></div></div>
            ${ej.series.map((s, si) => `<div class="serie-row"><span>#${si+1}</span><input type="number" value="${s.p}" onchange="updVal(${ei},${si},'p',this.value)"> <input type="number" value="${s.r}" onchange="updVal(${ei},${si},'r',this.value)"></div>`).join('')}
        </div>`).join('');
}

function updVal(ei, si, f, v) { db.semanas[activeW].dias[activeD].e[ei].series[si][f] = parseFloat(v) || 0; }
function addSerie(ei) { db.semanas[activeW].dias[activeD].e[ei].series.push({p:0,r:0}); renderEjercicios(); }

function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipoRutina = diaEditado.n.split(' ')[0]; // Ejemplo: "Push"
    db.rutinaMaestra[activeD] = JSON.parse(JSON.stringify(diaEditado));
    const hoy = new Date().toISOString().split('T')[0];
    if(!db.fechasEntreno.includes(hoy)) db.fechasEntreno.push(hoy);

    db.semanas.forEach((sem, sIdx) => {
        sem.dias.forEach(dia => {
            if (dia.n.startsWith(tipoRutina) && sIdx >= activeW) {
                dia.e.forEach(ejF => {
                    const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                    if(ejActual) ejF.series = JSON.parse(JSON.stringify(ejActual.series));
                });
            }
        });
    });
    save(); showView('days');
}

function renderGoals() {
    const ejsUnicos = [];
    rutinaMaestraOriginal.forEach(d => d.e.forEach(e => { if(!ejsUnicos.includes(e.name)) ejsUnicos.push(e.name); }));
    document.getElementById('goals-list').innerHTML = ejsUnicos.map(name => `
        <div class="serie-row">
            <span style="font-size:0.7rem;">${name}</span>
            <input type="number" id="goal-${name}" value="${db.objetivosEjercicios[name] || 0}">
        </div>`).join('');
}

function saveGoals() {
    const ejsUnicos = [];
    rutinaMaestraOriginal.forEach(d => d.e.forEach(e => { if(!ejsUnicos.includes(e.name)) ejsUnicos.push(e.name); }));
    ejsUnicos.forEach(name => { db.objetivosEjercicios[name] = parseFloat(document.getElementById('goal-'+name).value) || 0; });
    save(); alert("Objetivos guardados");
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').style.display = document.getElementById('overlay').style.display === 'block' ? 'none' : 'block'; }
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); if(v === 'calendar') renderCalendar(); if(v === 'goals') renderGoals(); toggleSidebar(); }
function showView(id) { document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden')); document.getElementById('view-' + id).classList.remove('hidden'); if(id === 'charts') updateCharts(); }
function renderGroups() {
    const cont = document.getElementById('groups-container');
    cont.innerHTML = "";
    for(let i=0; i<Math.ceil(db.semanas.length/12); i++) cont.innerHTML += `<div class="card-ejercicio" onclick="renderWInG(${i})">Bloque ${i+1}</div>`;
}
function nuevaSemana() { db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) }); save(); renderGroups(); }
function renderWInG(gi) {
    let h = "";
    for(let i=gi*12; i<Math.min((gi+1)*12, db.semanas.length); i++) h += `<div class="card-ejercicio" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h; showView('weeks');
}
function openW(i) { activeW = i; document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card-ejercicio" onclick="openD(${di})">${d.n}</div>`).join(''); showView('days'); }
function openD(di) { activeD = di; document.getElementById('day-title-header').innerText = db.semanas[activeW].dias[activeD].n; renderEjercicios(); showView('exercises'); }

function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const label = document.getElementById('monthLabel');
    grid.innerHTML = "";
    const y = currentCalDate.getFullYear(), m = currentCalDate.getMonth();
    label.innerText = (m+1) + " / " + y;
    for(let i=0; i<(new Date(y, m, 1).getDay() || 7)-1; i++) grid.innerHTML += `<div></div>`;
    for(let d=1; d<=new Date(y, m+1, 0).getDate(); d++) {
        const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        grid.innerHTML += `<div class="calendar-day ${db.fechasEntreno.includes(dStr) ? 'day-trained' : ''}">${d}</div>`;
    }
}
function setCalView(v) { currentCalView = v; document.getElementById('cal-month-box').classList.toggle('hidden', v!=='month'); document.getElementById('cal-year-box').classList.toggle('hidden', v!=='year'); renderCalendar(); }
function updateCharts() {
    const ctxR = document.getElementById('radarMusculos');
    const dataR = musculos.map(m => {
        let maxs = [];
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(ej => {
            if(ej.m === m) {
                let m1 = 0; ej.series.forEach(ser => { let r1 = ser.p * (1 + ser.r/30); if(r1 > m1) m1 = r1; });
                if(db.objetivosEjercicios[ej.name]) maxs.push((m1/db.objetivosEjercicios[ej.name])*100);
            }
        })));
        return maxs.length ? Math.min(maxs.reduce((a,b)=>a+b)/maxs.length, 100) : 0;
    });
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctxR, { type:'radar', data:{ labels:musculos, datasets:[{data:dataR, borderColor:'#39ff14', backgroundColor:'rgba(57,255,20,0.2)'}] }, options:{ scales:{r:{min:0,max:100,grid:{color:'#333'},ticks:{display:false}}}, plugins:{legend:{display:false}} }});
}
function resetData() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('gymNeonV21'); location.reload(); } }

if(db.semanas.length === 0) nuevaSemana();
updateCharts(); renderGroups();
</script>
</body>
</html>
