<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Neon Dynamic</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #050505; --card: #0f0f0f; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.2); --text: #ffffff; --gray: #666;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 70px; }
        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; }
        .menu-icon { font-size: 28px; color: var(--neon); cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #0a0a0a; z-index: 200; transition: 0.3s; border-right: 1px solid var(--neon); padding: 60px 20px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 15px 0; font-weight: bold; color: var(--text); text-transform: uppercase; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
        
        .card { background: var(--card); border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .ejercicio-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 10px; }
        .ej-name { color: var(--neon); font-weight: bold; font-size: 0.9rem; }
        
        .serie-row { display: grid; grid-template-columns: 0.5fr 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
        .serie-label { font-size: 0.65rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        
        input { background: transparent; border: none; border-bottom: 1px solid #333; color: var(--text); text-align: center; font-size: 0.95rem; padding: 4px; outline: none; width: 100%; }
        input:focus { border-bottom-color: var(--neon); }

        .btn-series { background: #1a1a1a; border: 1px solid #333; color: var(--text); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-series:active { border-color: var(--neon); color: var(--neon); }
        
        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .hidden { display: none; }
        .back-btn { color: var(--neon); cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div style="margin-left: 20px; font-weight: 800; letter-spacing: 2px;">SYMMETRY NEON</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 Radar</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 Mis Bloques</div>
        <div class="sidebar-item" onclick="toggleSidebar()">Cerrar</div>
    </div>

    <div id="view-charts">
        <h2>Estatus Muscular</h2>
        <canvas id="radarMusculos"></canvas>
    </div>

    <div id="view-groups" class="hidden">
        <h2>Bloques de Entrenamiento</h2>
        <div id="groups-container"></div>
        <button class="btn-main" onclick="nuevaSemana()">+ CREAR NUEVA SEMANA</button>
    </div>

    <div id="view-weeks" class="hidden">
        <span class="back-btn" onclick="showView('groups')">← VOLVER</span>
        <div id="semanas-container"></div>
    </div>

    <div id="view-days" class="hidden">
        <span class="back-btn" onclick="showView('weeks')">← VOLVER</span>
        <div id="dias-container"></div>
    </div>

    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER</span>
        <h2 id="day-title-header"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarTotal()">✓ GUARDAR Y ACTUALIZAR FUTURO</button>
    </div>

<script>
// Base de datos inicial con series dinámicas
const rutinaMaestraInicial = [
    { n: 'Push 1', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 1', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Legs', e: [
        { name: 'Sentadilla Bulgara', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Sentadilla', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Peso Muerto Manc.', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Femoral', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Pie', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Sentado', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Push 2', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 2', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV10')) || { semanas: [], rutinaMaestra: rutinaMaestraInicial };
let activeW = null, activeD = null;

function save() { localStorage.setItem('gymNeonV10', JSON.stringify(db)); updateRadar(); }

function addSerie(ei) {
    db.semanas[activeW].dias[activeD].e[ei].series.push({p:0, r:0});
    renderEjercicios();
}

function removeSerie(ei) {
    if(db.semanas[activeW].dias[activeD].e[ei].series.length > 1) {
        db.semanas[activeW].dias[activeD].e[ei].series.pop();
        renderEjercicios();
    }
}

function renderEjercicios() {
    const dia = db.semanas[activeW].dias[activeD];
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card">
            <div class="ejercicio-header">
                <span class="ej-name">${ej.name}</span>
                <div>
                    <button class="btn-series" onclick="removeSerie(${ei})">-</button>
                    <button class="btn-series" onclick="addSerie(${ei})">+</button>
                </div>
            </div>
            <div class="serie-row">
                <div class="serie-label">Set</div><div class="serie-label">Kg</div><div class="serie-label">Reps</div>
            </div>
            ${ej.series.map((s, si) => `
                <div class="serie-row">
                    <div style="color:var(--neon); font-size:0.8rem">#${si+1}</div>
                    <input type="number" value="${s.p}" onchange="updVal(${ei},${si},'p',this.value)">
                    <input type="number" value="${s.r}" onchange="updVal(${ei},${si},'r',this.value)">
                </div>
            `).join('')}
        </div>
    `).join('');
}

function updVal(ei, si, field, val) {
    db.semanas[activeW].dias[activeD].e[ei].series[si][field] = parseFloat(val) || 0;
}

function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipoDia = diaEditado.n.split(' ')[0];

    // Actualizar Maestra
    db.rutinaMaestra[activeD] = JSON.parse(JSON.stringify(diaEditado));

    // Propagar a futuro
    for (let i = activeW; i < db.semanas.length; i++) {
        db.semanas[i].dias.forEach((d, dIdx) => {
            if (i > activeW || (i === activeW && dIdx > activeD)) {
                if (d.n.startsWith(tipoDia)) {
                    d.e.forEach(ejF => {
                        const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                        if(ejActual) ejF.series = JSON.parse(JSON.stringify(ejActual.series));
                    });
                }
            }
        });
    }
    save();
    alert("Progreso guardado.");
    showView('days');
}

// FUNCIONES DE INTERFAZ BÁSICAS
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    const over = document.getElementById('overlay');
    over.style.display = over.style.display === 'block' ? 'none' : 'block';
}
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); toggleSidebar(); }
function showView(id) {
    document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden'));
    document.getElementById('view-' + id).classList.remove('hidden');
}
function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = nG === 0 ? "<p style='color:#444'>Crea tu primera semana.</p>" : "";
    for(let i=0; i<nG; i++) {
        cont.innerHTML += `<div class="card" onclick="renderWInG(${i})"><span style="color:var(--neon); font-size:0.7rem; border:1px solid var(--neon); padding:2px 4px;">BLOQUE ${i+1}</span><br><br>Semanas ${i*12+1} - ${Math.min((i+1)*12, db.semanas.length)}</div>`;
    }
}
function nuevaSemana() {
    db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) });
    save(); renderGroups();
}
function renderWInG(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}
function openW(i) {
    activeW = i;
    document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card" onclick="openD(${di})">${d.n}</div>`).join('');
    showView('days');
}
function openD(di) {
    activeD = di;
    document.getElementById('day-title-header').innerText = db.semanas[activeW].dias[activeD].n;
    renderEjercicios();
    showView('exercises');
}

let chart;
function updateRadar() {
    const ctx = document.getElementById('radarMusculos');
    const labels = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
    const data = labels.map(m => {
        let max = 0;
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(e => {
            if(e.m === m) e.series.forEach(serie => {
                let sc = (serie.p * serie.r)/2; 
                if(sc > max) max = sc;
            });
        })));
        return Math.min(max, 100);
    });
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'radar',
        data: { labels, datasets: [{ data, backgroundColor: 'rgba(57, 255, 20, 0.1)', borderColor: '#39ff14', borderWidth: 2 }] },
        options: { scales: { r: { grid: { color: '#222' }, angleLines: { color: '#222' }, pointLabels: { color: '#888' }, ticks: { display: false }, suggestMax: 100 } }, plugins: { legend: { display: false } } }
    });
}
updateRadar();
renderGroups();
</script>
</body>
</html>
