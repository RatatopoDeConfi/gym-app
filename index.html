<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Neon Series</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #050505; --card: #0f0f0f; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.2); --text: #ffffff; --gray: #666;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 70px; }
        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; }
        .menu-icon { font-size: 28px; color: var(--neon); cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #0a0a0a; z-index: 200; transition: 0.3s; border-right: 1px solid var(--neon); padding: 60px 20px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 15px 0; font-weight: bold; color: var(--text); text-transform: uppercase; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
        
        .card { background: var(--card); border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .ejercicio-header { color: var(--neon); font-weight: bold; margin-bottom: 10px; display: block; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        .serie-row { display: grid; grid-template-columns: 0.5fr 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 8px; padding: 5px 0; }
        .serie-label { font-size: 0.7rem; color: var(--gray); font-weight: bold; }
        
        input { background: transparent; border: none; border-bottom: 1px solid #333; color: var(--text); text-align: center; font-size: 0.9rem; padding: 4px; outline: none; width: 100%; }
        input:focus { border-bottom-color: var(--neon); color: var(--neon); }

        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; box-shadow: 0 0 10px var(--neon-dim); }
        .hidden { display: none; }
        .back-btn { color: var(--neon); cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div style="margin-left: 20px; font-weight: 800; letter-spacing: 2px; font-size: 0.9rem;">SYMMETRY NEON</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 Radar</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 Mis Bloques</div>
        <div class="sidebar-item" onclick="toggleSidebar()">Cerrar</div>
    </div>

    <div id="view-charts">
        <h2>Estatus Muscular</h2>
        <canvas id="radarMusculos"></canvas>
    </div>

    <div id="view-groups" class="hidden">
        <h2>Bloques (12 Semanas)</h2>
        <div id="groups-container"></div>
        <button class="btn-main" onclick="nuevaSemana()">+ CREAR NUEVA SEMANA</button>
    </div>

    <div id="view-weeks" class="hidden">
        <span class="back-btn" onclick="showView('groups')">← BLOQUES</span>
        <div id="semanas-container"></div>
    </div>

    <div id="view-days" class="hidden">
        <span class="back-btn" onclick="showView('weeks')">← SEMANAS</span>
        <div id="dias-container"></div>
    </div>

    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← DÍAS</span>
        <h2 id="day-title-header" style="font-size: 1rem;"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarSeries()">✓ GUARDAR TODAS LAS SERIES</button>
    </div>

<script>
// Plantilla con soporte para 3 series por ejercicio
const generarSeriesIniciales = () => [
    { p: 0, r: 0 }, { p: 0, r: 0 }, { p: 0, r: 0 }
];

const rutinaMaestraInicial = [
    { n: 'Push 1', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: generarSeriesIniciales() },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: generarSeriesIniciales() },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: generarSeriesIniciales() },
        { name: 'Curl Martillo', m: 'Biceps', series: generarSeriesIniciales() },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: generarSeriesIniciales() },
        { name: 'Press Militar', m: 'Hombro', series: generarSeriesIniciales() }
    ]},
    { n: 'Pull 1', e: [
        { name: 'Dominadas', m: 'Espalda', series: generarSeriesIniciales() },
        { name: 'Remo Unilateral', m: 'Espalda', series: generarSeriesIniciales() },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: generarSeriesIniciales() },
        { name: 'Press Cerrado', m: 'Triceps', series: generarSeriesIniciales() },
        { name: 'Press Frances', m: 'Triceps', series: generarSeriesIniciales() },
        { name: 'Dragon Flags', m: 'Core', series: generarSeriesIniciales() }
    ]},
    { n: 'Legs', e: [
        { name: 'Sentadilla Bulgara', m: 'Pierna', series: generarSeriesIniciales() },
        { name: 'Sentadilla', m: 'Pierna', series: generarSeriesIniciales() },
        { name: 'Peso Muerto Manc.', m: 'Pierna', series: generarSeriesIniciales() },
        { name: 'Curl Femoral', m: 'Pierna', series: generarSeriesIniciales() },
        { name: 'Gemelos Pie', m: 'Pierna', series: generarSeriesIniciales() },
        { name: 'Gemelos Sentado', m: 'Pierna', series: generarSeriesIniciales() }
    ]},
    { n: 'Push 2', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: generarSeriesIniciales() },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: generarSeriesIniciales() },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: generarSeriesIniciales() },
        { name: 'Curl Martillo', m: 'Biceps', series: generarSeriesIniciales() },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: generarSeriesIniciales() },
        { name: 'Press Militar', m: 'Hombro', series: generarSeriesIniciales() }
    ]},
    { n: 'Pull 2', e: [
        { name: 'Dominadas', m: 'Espalda', series: generarSeriesIniciales() },
        { name: 'Remo Unilateral', m: 'Espalda', series: generarSeriesIniciales() },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: generarSeriesIniciales() },
        { name: 'Press Cerrado', m: 'Triceps', series: generarSeriesIniciales() },
        { name: 'Press Frances', m: 'Triceps', series: generarSeriesIniciales() },
        { name: 'Dragon Flags', m: 'Core', series: generarSeriesIniciales() }
    ]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV9')) || { semanas: [], rutinaMaestra: rutinaMaestraInicial };
let activeW = null, activeD = null;

function save() { localStorage.setItem('gymNeonV9', JSON.stringify(db)); updateRadar(); }

function nuevaSemana() {
    db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) });
    save(); renderGroups();
}

function finalizarYPropagarSeries() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipoDia = diaEditado.n.split(' ')[0]; 

    // 1. Actualizar Plantilla Maestra
    db.rutinaMaestra[activeD] = JSON.parse(JSON.stringify(diaEditado));

    // 2. Propagar a futuro (misma categoría de día)
    for (let i = activeW; i < db.semanas.length; i++) {
        db.semanas[i].dias.forEach((dFuturo, dfIdx) => {
            if (i > activeW || (i === activeW && dfIdx > activeD)) {
                if (dFuturo.n.startsWith(tipoDia)) {
                    dFuturo.e.forEach(ejF => {
                        const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                        if(ejActual) ejF.series = JSON.parse(JSON.stringify(ejActual.series));
                    });
                }
            }
        });
    }
    save();
    alert("¡Series guardadas y sincronizadas!");
    showView('days');
}

function openD(di) {
    activeD = di;
    const dia = db.semanas[activeW].dias[di];
    document.getElementById('day-title-header').innerText = dia.n;
    
    let html = dia.e.map((ej, ei) => `
        <div class="card">
            <span class="ejercicio-header">${ej.name}</span>
            <div class="serie-row" style="border-bottom: 1px solid #222; margin-bottom: 5px;">
                <div class="serie-label">SERIE</div>
                <div class="serie-label">PESO (kg)</div>
                <div class="serie-label">REPS</div>
            </div>
            ${ej.series.map((s, si) => `
                <div class="serie-row">
                    <div style="color:var(--neon); font-size:0.8rem;">#${si+1}</div>
                    <input type="number" value="${s.p}" onchange="updSerie(${ei}, ${si}, 'p', this.value)">
                    <input type="number" value="${s.r}" onchange="updSerie(${ei}, ${si}, 'r', this.value)">
                </div>
            `).join('')}
        </div>
    `).join('');
    
    document.getElementById('ejercicios-container').innerHTML = html;
    showView('exercises');
}

function updSerie(ei, si, field, val) {
    db.semanas[activeW].dias[activeD].e[ei].series[si][field] = parseFloat(val) || 0;
}

// FUNCIONES DE INTERFAZ BÁSICAS
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    const over = document.getElementById('overlay');
    over.style.display = over.style.display === 'block' ? 'none' : 'block';
}
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); toggleSidebar(); }
function showView(id) {
    document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden'));
    document.getElementById('view-' + id).classList.remove('hidden');
}
function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = nG === 0 ? "<p style='color:#444'>No hay semanas. Crea una.</p>" : "";
    for(let i=0; i<nG; i++) {
        cont.innerHTML += `<div class="card" onclick="renderWInG(${i})"><span style="color:var(--neon); font-size:0.7rem; border:1px solid var(--neon); padding:2px 4px;">BLOQUE ${i+1}</span><br><br>Semanas ${i*12+1} - ${Math.min((i+1)*12, db.semanas.length)}</div>`;
    }
}
function renderWInG(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}
function openW(i) {
    activeW = i;
    document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card" onclick="openD(${di})">${d.n}</div>`).join('');
    showView('days');
}

let chart;
function updateRadar() {
    const ctx = document.getElementById('radarMusculos');
    const labels = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
    const data = labels.map(m => {
        let max = 0;
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(e => {
            if(e.m === m) { 
                e.series.forEach(serie => {
                    let sc = (serie.p * serie.r)/2; 
                    if(sc > max) max = sc;
                });
            }
        })));
        return Math.min(max, 100);
    });
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'radar',
        data: { labels, datasets: [{ data, backgroundColor: 'rgba(57, 255, 20, 0.1)', borderColor: '#39ff14', borderWidth: 2 }] },
        options: { scales: { r: { grid: { color: '#222' }, angleLines: { color: '#222' }, pointLabels: { color: '#888' }, ticks: { display: false }, suggestMax: 100 } }, plugins: { legend: { display: false } } }
    });
}

updateRadar();
renderGroups();
</script>
</body>
</html>
