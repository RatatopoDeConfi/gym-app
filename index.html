<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symmetry Pro | Ultimate UI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0c; --card: #1c1c21; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.1); --text: #f0f0f0; --gray: #999;
            --accent: #25252b; --red: #ff4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 90px; }
        h1, h2, h3, .logo { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: rgba(10,10,12,0.9); backdrop-filter: blur(15px); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #222; justify-content: space-between; }
        .menu-icon { font-size: 28px; color: var(--neon); cursor: pointer; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); z-index: 200; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-right: 1px solid #333; padding: 100px 30px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 20px 0; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }

        .card-ejercicio { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .ej-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px; }
        .ej-name { color: var(--neon); font-family: 'Orbitron'; font-size: 0.85rem; font-weight: 700; max-width: 60%; }
        
        .controls-series { display: flex; gap: 8px; }
        .btn-s { background: #2a2a30; border: 1px solid #444; color: var(--text); width: 34px; height: 34px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }

        .serie-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 12px; margin-bottom: 15px; align-items: center; }
        .serie-num { color: var(--gray); font-weight: 800; font-size: 0.75rem; font-family: 'Orbitron'; }
        .input-group { position: relative; }
        .input-group span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.6rem; color: #555; font-weight: 800; text-transform: uppercase; }
        
        input { background: var(--accent); border: 1px solid #3a3a40; border-radius: 10px; color: #fff; text-align: center; font-size: 1.1rem; padding: 12px 5px; width: 100%; transition: 0.3s; font-weight: 600; }
        input:focus { border-color: var(--neon); outline: none; background: #2a2a32; }

        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 20px; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-family: 'Orbitron'; font-size: 0.9rem; box-shadow: 0 4px 20px var(--neon-dim); }
        .btn-main:active { transform: scale(0.98); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 8px; background: #25252b; color: #666; }
        .day-trained { background: var(--neon) !important; color: #000 !important; font-weight: bold; box-shadow: 0 0 10px var(--neon-dim); }
        .day-current { border: 2px solid var(--neon); }

        .year-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .dot-year { aspect-ratio: 1/1; background: #222; border-radius: 2px; }
        .dot-trained { background: var(--neon); }

        .hidden { display: none; }
        .back-btn { color: var(--gray); cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 150; display: none; }

        /* --- Habit Tracker --- */
        .habit-summary-card { padding: 22px 20px; }
        .habit-summary-row { display: flex; justify-content: space-around; text-align: center; }
        .habit-score-circle-label { font-size: 0.6rem; color: var(--gray); font-family: 'Orbitron'; letter-spacing: 1px; margin-bottom: 6px; }
        .habit-score-value { font-size: 2.2rem; font-weight: 800; font-family: 'Orbitron'; color: var(--neon); }
        .habit-score-caption { font-size: 0.7rem; color: var(--gray); margin-top: 4px; }

        .habit-progress-bar { width: 100%; height: 6px; background: #25252b; border-radius: 4px; overflow: hidden; }
        .habit-progress-bar-lg { height: 10px; margin-top: 18px; }
        .habit-progress-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #39ff14); border-radius: 4px; transition: width 0.4s ease; }

        .habit-week-nav { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 14px; }

        .habit-cat-card { background: var(--card); border: 1px solid #333; border-radius: 16px; padding: 18px; margin-bottom: 20px; }
        .habit-cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--neon); letter-spacing: 1px; }
        .habit-add-btn { background: #2a2a30; border: 1px solid #444; color: var(--gray); font-size: 0.65rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-family: 'Inter'; text-transform: none; letter-spacing: 0; }

        .habit-row { border-top: 1px solid #2a2a2a; padding: 14px 0; }
        .habit-row:first-child { border-top: none; padding-top: 0; }
        .habit-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .habit-name { font-size: 0.85rem; font-weight: 600; }
        .habit-stats { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--gray); white-space: nowrap; }
        .habit-streak { color: #ffb020; font-weight: 700; }
        .habit-trend { font-weight: 700; }
        .trend-up { color: #39ff14; }
        .trend-down { color: #ff4444; }
        .trend-flat { color: #666; }
        .habit-pct { font-weight: 700; color: var(--text); min-width: 32px; text-align: right; }
        .habit-del-btn { background: none; border: none; color: #555; font-size: 1rem; cursor: pointer; padding: 0 2px; line-height: 1; }

        .habit-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
        .habit-day-toggle { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #25252b; color: #666; font-size: 0.7rem; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .habit-day-toggle.done { background: rgba(57, 255, 20, 0.18); color: #39ff14; border-color: rgba(57, 255, 20, 0.4); }
        .habit-day-toggle.missed { background: rgba(255, 68, 68, 0.10); color: #ff8080; }
        .habit-day-toggle.today { border-color: var(--neon); }
        .habit-day-toggle.future { opacity: 0.35; cursor: default; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div class="logo" style="color:var(--neon); font-size: 0.8rem;">SYMMETRY PRO</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 PROGRESO ANALÍTICO</div>
        <div class="sidebar-item" onclick="changeView('calendar')">📅 CALENDARIO DISCIPLINA</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 MIS RUTINAS</div>
        <div class="sidebar-item" onclick="changeView('goals')">🎯 OBJETIVOS FUERZA</div>
        <div class="sidebar-item" onclick="changeView('habits')">🔥 HÁBITOS Y VIDA</div>
        <div class="sidebar-item" onclick="resetData()" style="color:var(--red);">⚠ REINICIAR DATOS</div>
    </div>

    <div id="view-calendar" class="hidden">
        <h2>Disciplina</h2>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button id="btn-month" class="btn-main" style="margin:0; padding:10px; background:#222; color:var(--gray);" onclick="setCalView('month')">MES</button>
            <button id="btn-year" class="btn-main" style="margin:0; padding:10px; background:#222; color:var(--gray);" onclick="setCalView('year')">AÑO</button>
        </div>
        <div id="cal-month-box" class="card-ejercicio">
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px;">
                <button class="btn-s" onclick="changeMonth(-1)">‹</button>
                <div id="monthLabel" style="font-family:'Orbitron'; color:var(--neon); font-size:0.9rem;"></div>
                <button class="btn-s" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div id="cal-year-box" class="card-ejercicio hidden">
            <div class="year-container" id="yearContainer"></div>
        </div>
    </div>

    <div id="view-charts">
        <canvas id="radarMusculos" style="margin-bottom:30px;"></canvas>
        <canvas id="lineProgress"></canvas>
    </div>

    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER ATRÁS</span>
        <h2 id="day-title-header" style="color:var(--neon); margin-top:0;"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarTotal()">GUARDAR SESIÓN Y SINCRONIZAR</button>
    </div>

    <div id="view-groups" class="hidden"><h2>Bloques</h2><div id="groups-container"></div><button class="btn-main" onclick="nuevaSemana()">+ NUEVA SEMANA</button></div>
    <div id="view-weeks" class="hidden"><span class="back-btn" onclick="showView('groups')">← VOLVER</span><div id="semanas-container"></div></div>
    <div id="view-days" class="hidden"><span class="back-btn" onclick="showView('weeks')">← VOLVER</span><div id="dias-container"></div></div>
    <div id="view-goals" class="hidden"><h2>Objetivos</h2><div id="goals-list"></div><button class="btn-main" onclick="saveGoals()">GUARDAR OBJETIVOS</button></div>

    <div id="view-habits" class="hidden">
        <h2>Hábitos y Vida</h2>

        <div class="card-ejercicio habit-summary-card">
            <div class="habit-summary-row">
                <div>
                    <div class="habit-score-circle-label">DÍA EXITOSO</div>
                    <div class="habit-score-value" id="habitDailyScoreValue">0%</div>
                    <div class="habit-score-caption" id="habitDailyScoreLabel"></div>
                </div>
                <div>
                    <div class="habit-score-circle-label">RACHA PERFECTA</div>
                    <div class="habit-score-value" id="habitPerfectStreak">0</div>
                    <div class="habit-score-caption">días al 100%</div>
                </div>
            </div>
            <div class="habit-progress-bar habit-progress-bar-lg">
                <div class="habit-progress-fill" id="habitDailyScoreFill" style="width:0%"></div>
            </div>
        </div>

        <div class="habit-week-nav">
            <button class="btn-s" onclick="changeHabitWeek(-1)">‹</button>
            <div id="habitWeekLabel" style="font-family:'Orbitron'; color:var(--neon); font-size:0.8rem;"></div>
            <button class="btn-s" onclick="changeHabitWeek(1)">›</button>
        </div>

        <div id="habits-container"></div>
    </div>

<script>
const musculos = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
const monthNames = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

// TODOS LOS VALORES INICIALES A 0
const rutinaMaestraOriginal = [
    { n: 'Push 1', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 1', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Legs', e: [
        { name: 'Sentadilla Bulgara', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Sentadilla', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Peso Muerto Manc.', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Femoral', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Pie', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Sentado', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Push 2', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 2', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV20')) || { semanas: [], rutinaMaestra: [], objetivosEjercicios: {}, fechasEntreno: [] };
if(db.rutinaMaestra.length === 0) db.rutinaMaestra = JSON.parse(JSON.stringify(rutinaMaestraOriginal));

// --- Habit Tracker: setup ---
function makeId(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const defaultHabitCategories = [
    { name: 'Salud / Fitness', icon: '💪', habits: ['Beber 2L de agua', 'Entrenar / Mover el cuerpo', 'Dormir 7-8h', 'Comer sin ultraprocesados'] },
    { name: 'Desarrollo Personal', icon: '🧠', habits: ['Leer 20 min', 'Meditar / Respirar', 'Escribir diario'] },
    { name: 'Trabajo / Estudios', icon: '💼', habits: ['Planificar el día', 'Bloque de trabajo profundo', 'Cero redes en horario laboral'] },
    { name: 'Finanzas', icon: '💰', habits: ['Registrar gastos del día', 'No gastos impulsivos'] },
    { name: 'Rutina Diaria', icon: '🌅', habits: ['Hacer la cama', 'Rutina de mañana', 'Rutina nocturna / desconexión'] }
];

function buildDefaultHabits() {
    return {
        categories: defaultHabitCategories.map(cat => ({
            id: makeId('cat'), name: cat.name, icon: cat.icon,
            habits: cat.habits.map(h => ({ id: makeId('hab'), name: h }))
        })),
        log: {}
    };
}

if (!db.habits) db.habits = buildDefaultHabits();

let activeW = null, activeD = null;
let currentCalDate = new Date();
let currentCalView = 'month';
let habitWeekOffset = 0;
let radarChart, lineChart;

function renderEjercicios() {
    const dia = db.semanas[activeW].dias[activeD];
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card-ejercicio">
            <div class="ej-header">
                <span class="ej-name">${ej.name}</span>
                <div class="controls-series">
                    <button class="btn-s" onclick="removeSerie(${ei})">-</button>
                    <button class="btn-s" onclick="addSerie(${ei})">+</button>
                </div>
            </div>
            ${ej.series.map((s, si) => `
                <div class="serie-row">
                    <div class="serie-num">SET ${si+1}</div>
                    <div class="input-group">
                        <input type="number" step="0.5" value="${s.p}" onchange="updVal(${ei},${si},'p',this.value)">
                        <span>kg</span>
                    </div>
                    <div class="input-group">
                        <input type="number" value="${s.r}" onchange="updVal(${ei},${si},'r',this.value)">
                        <span>reps</span>
                    </div>
                </div>
            `).join('')}
        </div>`).join('');
}

function persist() { localStorage.setItem('gymNeonV20', JSON.stringify(db)); }
function save() { persist(); updateCharts(); renderCalendar(); }
function updVal(ei, si, f, v) { db.semanas[activeW].dias[activeD].e[ei].series[si][f] = parseFloat(v) || 0; }
function addSerie(ei) { db.semanas[activeW].dias[activeD].e[ei].series.push({p:0, r:0}); renderEjercicios(); }
function removeSerie(ei) { if(db.semanas[activeW].dias[activeD].e[ei].series.length > 1) { db.semanas[activeW].dias[activeD].e[ei].series.pop(); renderEjercicios(); } }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); const over = document.getElementById('overlay'); over.style.display = over.style.display === 'block' ? 'none' : 'block'; }
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); if(v === 'calendar') renderCalendar(); if(v === 'goals') renderGoals(); if(v === 'habits') renderHabits(); toggleSidebar(); }
function showView(id) { document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden')); document.getElementById('view-' + id).classList.remove('hidden'); if(id === 'charts') updateCharts(); }

function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = "";
    for(let i=0; i<nG; i++) { cont.innerHTML += `<div class="card-ejercicio" onclick="renderWInG(${i})"><div style="font-size:0.6rem; color:var(--neon); margin-bottom:5px">BLOQUE ${i+1}</div><div style="font-weight:bold; font-size:1.1rem">Semanas ${i*12+1} - ${Math.min((i+1)*12, db.semanas.length)}</div></div>`; }
}
function nuevaSemana() { db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) }); save(); renderGroups(); }
function renderWInG(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card-ejercicio" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}
function openW(i) { activeW = i; document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card-ejercicio" onclick="openD(${di})">${d.n}</div>`).join(''); showView('days'); }
function openD(di) { activeD = di; document.getElementById('day-title-header').innerText = db.semanas[activeW].dias[activeD].n; renderEjercicios(); showView('exercises'); }

function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipo = diaEditado.n.split(' ')[0];

    db.rutinaMaestra.forEach(rmD => {
        if(rmD.n.startsWith(tipo)) {
            rmD.e.forEach(ejM => {
                const ejE = diaEditado.e.find(x => x.name === ejM.name);
                if(ejE) ejM.series = JSON.parse(JSON.stringify(ejE.series));
            });
        }
    });

    db.semanas.forEach((sem, sIdx) => {
        if (sIdx >= activeW) {
            sem.dias.forEach((dia, dIdx) => {
                if (sIdx > activeW || dIdx >= activeD) {
                    if (dia.n.startsWith(tipo)) {
                        dia.e.forEach(ejF => {
                            const ejE = diaEditado.e.find(x => x.name === ejF.name);
                            if(ejE) ejF.series = JSON.parse(JSON.stringify(ejE.series));
                        });
                    }
                }
            });
        }
    });

    const hoy = new Date().toISOString().split('T')[0];
    if(!db.fechasEntreno.includes(hoy)) db.fechasEntreno.push(hoy);
    
    save(); showView('days');
}

function renderGoals() {

    rutinaMaestraOriginal.forEach(d => d.e.forEach(e => { if(!ejs.includes(e.name)) ejs.push(e.name); }));
    document.getElementById('goals-list').innerHTML = ejs.map(name => `
        <div class="card-ejercicio" style="display:flex; justify-content:space-between; align-items:center; padding:15px; margin-bottom:10px;">
            <span style="font-family:'Orbitron'; font-size:0.7rem;">${name}</span>
            <input type="number" id="goal-${name}" style="width:100px;" value="${db.objetivosEjercicios[name] || 0}">
        </div>`).join('');
}

function saveGoals() {
    const ejs = [];
    rutinaMaestraOriginal.forEach(d => d.e.forEach(e => { if(!ejs.includes(e.name)) ejs.push(e.name); }));
    ejs.forEach(name => { db.objetivosEjercicios[name] = parseFloat(document.getElementById('goal-'+name).value) || 0; });

function setCalView(v) {
    currentCalView = v;
    document.getElementById('btn-month').style.background = v === 'month' ? 'var(--neon)' : '#222';
    document.getElementById('btn-month').style.color = v === 'month' ? '#000' : 'var(--gray)';
    document.getElementById('btn-year').style.background = v === 'year' ? 'var(--neon)' : '#222';
    document.getElementById('btn-year').style.color = v === 'year' ? '#000' : 'var(--gray)';
    document.getElementById('cal-month-box').classList.toggle('hidden', v !== 'month');
    document.getElementById('cal-year-box').classList.toggle('hidden', v !== 'year');
    renderCalendar();
}

function renderCalendar() {
    if(currentCalView === 'month') {
        const grid = document.getElementById('calendarGrid');
        const label = document.getElementById('monthLabel');
        grid.innerHTML = "";
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        label.innerText = `${monthNames[month]} ${year}`;
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        let startDay = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startDay; i++) grid.innerHTML += `<div></div>`;
        const hoyStr = new Date().toISOString().split('T')[0];
        for(let d=1; d<=daysInMonth; d++) {
            const dStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isTrained = db.fechasEntreno.includes(dStr);
            grid.innerHTML += `<div class="calendar-day ${isTrained ? 'day-trained' : ''} ${dStr === hoyStr ? 'day-current' : ''}">${d}</div>`;
        }
    } else {
        const yearContainer = document.getElementById('yearContainer');
        yearContainer.innerHTML = "";
        const currentYear = new Date().getFullYear();
        for(let m=0; m<12; m++) {
            let monthHtml = `<div style="margin-bottom:10px;"><div style="font-size:0.5rem; color:var(--gray); text-align:center; margin-bottom:4px;">${monthNames[m]}</div><div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">`;
            const daysInMonth = new Date(currentYear, m+1, 0).getDate();
            for(let d=1; d<=daysInMonth; d++) {
                const dStr = `${currentYear}-${String(m+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                monthHtml += `<div class="dot-year ${db.fechasEntreno.includes(dStr) ? 'dot-trained' : ''}"></div>`;
            }
            monthHtml += `</div></div>`;
            yearContainer.innerHTML += monthHtml;
        }
    }
}
function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); renderCalendar(); }

function updateCharts() {
    const ctxRadar = document.getElementById('radarMusculos');
    const dataMuscular = musculos.map(m => {
        let porcentajes = [];
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(ej => {
            if(ej.m === m) {
                let maxR1M = 0;
                ej.series.forEach(ser => { let r1m = ser.p * (1 + ser.r/30); if(r1m > maxR1M) maxR1M = r1m; });
                let obj = db.objetivosEjercicios[ej.name] || 100;
                porcentajes.push((maxR1M / obj) * 100);
            }
        })));
        return porcentajes.length === 0 ? 0 : Math.min(porcentajes.reduce((a,b) => a+b, 0) / porcentajes.length, 100);
    });
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctxRadar, { type: 'radar', data: { labels: musculos, datasets: [{ data: dataMuscular, backgroundColor: 'rgba(57, 255, 20, 0.2)', borderColor: '#39ff14', borderWidth: 2 }] }, options: { scales: { r: { min: 0, max: 100, grid: { color: '#333' }, angleLines: { color: '#333' }, pointLabels: { color: '#aaa', font: { size: 10 } }, ticks: { display: false } } }, plugins: { legend: { display: false } } } });

    const ctxLine = document.getElementById('lineProgress');
    const hist = { Push: [], Pull: [], Legs: [] };
    db.semanas.forEach(s => s.dias.forEach(d => {
        const cat = d.n.split(' ')[0];
        if(hist[cat]) {
            let v = 0; d.e.forEach(ej => ej.series.forEach(ser => v += (ser.p * ser.r)));
            if(v > 0) hist[cat].push(v);
        }
    }));
    if(lineChart) lineChart.destroy();
    lineChart = new Chart(ctxLine, { type: 'line', data: { labels: Array.from({length: 10}, (_, i) => i + 1), datasets: [{ label: 'Push', data: hist.Push.slice(-10), borderColor: '#39ff14' }, { label: 'Pull', data: hist.Pull.slice(-10), borderColor: '#00d4ff' }, { label: 'Legs', data: hist.Legs.slice(-10), borderColor: '#ff0055' }] }, options: { scales: { y: { grid: { color: '#222' } }, x: { display: false } }, plugins: { legend: { labels: { color: '#888', font: { size: 10 } } } } } });
}
function resetData() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('gymNeonV20'); location.reload(); } }

// --- Habit Tracker: fechas ---
const dayLetters = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
function fmtDate(d) { return d.toISOString().split('T')[0]; }
function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
    date.setHours(0, 0, 0, 0);
    return date;
}
function getWeekDates(offsetWeeks) {
    const monday = getMonday(new Date());
    monday.setDate(monday.getDate() + offsetWeeks * 7);
    return Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
}

// --- Habit Tracker: datos ---
function isHabitDone(habitId, dateStr) { return !!(db.habits.log[habitId] && db.habits.log[habitId][dateStr]); }
function toggleHabit(habitId, dateStr) {
    if (!db.habits.log[habitId]) db.habits.log[habitId] = {};
    db.habits.log[habitId][dateStr] = !db.habits.log[habitId][dateStr];
    if (!db.habits.log[habitId][dateStr]) delete db.habits.log[habitId][dateStr];
    persist(); renderHabits();
}

// --- Habit Tracker: métricas ---
function computeStreak(habitId) {
    let streak = 0, d = new Date();
    if (!isHabitDone(habitId, fmtDate(d))) d.setDate(d.getDate() - 1);
    while (isHabitDone(habitId, fmtDate(d))) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
}
function computeWeekPct(habitId, offsetWeeks) {
    const dates = getWeekDates(offsetWeeks);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const applicable = dates.filter(d => d <= today);
    if (applicable.length === 0) return null;
    const done = applicable.filter(d => isHabitDone(habitId, fmtDate(d))).length;
    return Math.round((done / applicable.length) * 100);
}
function computeTrend(habitId, offsetWeeks) {
    const cur = computeWeekPct(habitId, offsetWeeks);
    const prev = computeWeekPct(habitId, offsetWeeks - 1);
    if (cur === null || prev === null) return 'flat';
    if (cur > prev) return 'up';
    if (cur < prev) return 'down';
    return 'flat';
}
function computeDailyScore(dateStr) {
    let total = 0, done = 0;
    db.habits.categories.forEach(cat => cat.habits.forEach(h => { total++; if (isHabitDone(h.id, dateStr)) done++; }));
    return total === 0 ? 0 : Math.round((done / total) * 100);
}
function computePerfectStreak() {
    const totalHabits = db.habits.categories.reduce((s, c) => s + c.habits.length, 0);
    if (totalHabits === 0) return 0;
    let streak = 0, d = new Date();
    if (computeDailyScore(fmtDate(d)) < 100) d.setDate(d.getDate() - 1);
    while (computeDailyScore(fmtDate(d)) === 100) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
}
function habitScoreLabel(score) {
    if (score >= 90) return '¡Día perfecto! 🚀';
    if (score >= 70) return 'Vas muy bien 💪';
    if (score >= 40) return 'Sigue así, puedes más';
    if (score > 0) return 'Necesitas mejorar';
    return 'Aún no has marcado nada hoy';
}

// --- Habit Tracker: gestión de hábitos ---
function addHabit(catId) {
    const name = prompt('Nombre del nuevo hábito/tarea:');
    if (!name || !name.trim()) return;
    const cat = db.habits.categories.find(c => c.id === catId);
    cat.habits.push({ id: makeId('hab'), name: name.trim() });
    persist(); renderHabits();
}
function deleteHabit(catId, habitId) {
    if (!confirm('¿Eliminar este hábito?')) return;
    const cat = db.habits.categories.find(c => c.id === catId);
    cat.habits = cat.habits.filter(h => h.id !== habitId);
    delete db.habits.log[habitId];
    persist(); renderHabits();
}
function changeHabitWeek(dir) {
    const newOffset = habitWeekOffset + dir;
    if (newOffset > 0) return;
    habitWeekOffset = newOffset;
    renderHabits();
}

// --- Habit Tracker: render ---
function renderHabits() {
    const todayStr = fmtDate(new Date());
    const dailyScore = computeDailyScore(todayStr);
    document.getElementById('habitDailyScoreValue').innerText = dailyScore + '%';
    document.getElementById('habitDailyScoreFill').style.width = dailyScore + '%';
    document.getElementById('habitDailyScoreLabel').innerText = habitScoreLabel(dailyScore);
    document.getElementById('habitPerfectStreak').innerText = computePerfectStreak();

    const dates = getWeekDates(habitWeekOffset);
    document.getElementById('habitWeekLabel').innerText =
        `${dates[0].getDate()} ${monthNames[dates[0].getMonth()]} - ${dates[6].getDate()} ${monthNames[dates[6].getMonth()]}`;

    const today = new Date(); today.setHours(0, 0, 0, 0);

    document.getElementById('habits-container').innerHTML = db.habits.categories.map(cat => `
        <div class="habit-cat-card">
            <div class="habit-cat-header">
                <span>${cat.icon} ${cat.name}</span>
                <button class="habit-add-btn" onclick="addHabit('${cat.id}')">+ Añadir</button>
            </div>
            ${cat.habits.map(h => {
                const streak = computeStreak(h.id);
                const pct = computeWeekPct(h.id, habitWeekOffset);
                const trend = computeTrend(h.id, habitWeekOffset);
                const trendArrow = trend === 'up' ? '▲' : trend === 'down' ? '▼' : '▬';
                return `
                <div class="habit-row">
                    <div class="habit-row-top">
                        <span class="habit-name">${h.name}</span>
                        <div class="habit-stats">
                            <span class="habit-streak">🔥${streak}</span>
                            <span class="habit-trend trend-${trend}">${trendArrow}</span>
                            <span class="habit-pct">${pct === null ? '-' : pct + '%'}</span>
                            <button class="habit-del-btn" onclick="deleteHabit('${cat.id}','${h.id}')">×</button>
                        </div>
                    </div>
                    <div class="habit-days">
                        ${dates.map(d => {
                            const dStr = fmtDate(d);
                            const done = isHabitDone(h.id, dStr);
                            const isFuture = d > today;
                            const isPast = d < today;
                            const missed = isPast && !done;
                            const isToday = dStr === todayStr;
                            return `<div class="habit-day-toggle ${done ? 'done' : ''} ${missed ? 'missed' : ''} ${isFuture ? 'future' : ''} ${isToday ? 'today' : ''}" onclick="${isFuture ? '' : `toggleHabit('${h.id}','${dStr}')`}">${dayLetters[(d.getDay() + 6) % 7]}</div>`;
                        }).join('')}
                    </div>
                    <div class="habit-progress-bar"><div class="habit-progress-fill" style="width:${pct || 0}%"></div></div>
                </div>`;
            }).join('')}
        </div>
    `).join('');
}
