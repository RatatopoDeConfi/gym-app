<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Pro | Mi Rutina</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0c; --card: #16161a; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.15); --text: #e0e0e0; --gray: #888;
            --accent: #1f1f23;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; padding-top: 80px; line-height: 1.6;
        }
        h1, h2, h3, .logo { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }

        .header-controls { 
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; 
            background: rgba(10,10,12,0.8); backdrop-filter: blur(10px);
            display: flex; align-items: center; padding: 0 25px; z-index: 100; 
            border-bottom: 1px solid #222; justify-content: space-between;
        }
        .menu-icon { font-size: 24px; color: var(--neon); cursor: pointer; }

        .sidebar { 
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%; 
            background: var(--card); z-index: 200; transition: 0.4s; 
            border-right: 1px solid var(--neon-dim); padding: 80px 30px; 
        }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 18px 0; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 1px solid #222; }

        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .ejercicio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .ej-name { color: var(--text); font-weight: 700; font-size: 0.9rem; }
        
        .serie-row { display: grid; grid-template-columns: 0.6fr 1fr 1fr; gap: 15px; margin-bottom: 12px; }
        .serie-label { font-size: 0.6rem; color: var(--gray); text-transform: uppercase; font-weight: 800; }
        
        input { 
            background: var(--accent); border: 1px solid #333; border-radius: 6px;
            color: var(--neon); text-align: center; font-size: 1rem; padding: 8px; 
            outline: none; width: 100%; 
        }
        input:focus { border-color: var(--neon); }

        .btn-series { background: #222; border: 1px solid #444; color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
        .btn-main { 
            width: 100%; background: var(--neon); border: none; color: #000; 
            padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; margin-top: 10px; font-family: 'Orbitron';
        }

        .hidden { display: none; }
        .back-btn { color: var(--gray); cursor: pointer; margin-bottom: 25px; display: inline-block; font-size: 0.8rem; font-weight: 700; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; display: none; }

        canvas { background: rgba(255,255,255,0.02); border-radius: 12px; padding: 10px; margin-bottom: 40px; width: 100% !important; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div class="logo" style="color:var(--neon); font-size: 0.9rem;">SYMMETRY PRO</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 Estadísticas</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 Mi Rutina</div>
        <div class="sidebar-item" onclick="changeView('goals')">🎯 Objetivos Ejercicios</div>
        <div class="sidebar-item" onclick="resetData()" style="color:#ff4444; margin-top: 20px;">⚠ Reset Datos</div>
    </div>

    <div id="view-charts">
        <h3 style="font-size: 0.7rem; color: var(--gray);">Maestría Muscular (Objetivo individual)</h3>
        <canvas id="radarMusculos"></canvas>
        <h3 style="font-size: 0.7rem; color: var(--gray);">Progresión de Volumen (Fuerza Total)</h3>
        <canvas id="lineProgress"></canvas>
    </div>

    <div id="view-goals" class="hidden">
        <h2>Objetivos de Peso</h2>
        <p style="color:var(--gray); font-size: 0.7rem; margin-bottom: 20px;">Indica el peso que quieres alcanzar en cada uno.</p>
        <div id="goals-list"></div>
        <button class="btn-main" onclick="saveGoals()">Guardar Objetivos</button>
    </div>

    <div id="view-groups" class="hidden">
        <h2>Mis Bloques</h2>
        <div id="groups-container"></div>
        <button class="btn-main" onclick="nuevaSemana()">+ Empezar Nueva Semana</button>
    </div>

    <div id="view-weeks" class="hidden"><span class="back-btn" onclick="showView('groups')">← BLOQUES</span><div id="semanas-container"></div></div>
    <div id="view-days" class="hidden"><span class="back-btn" onclick="showView('weeks')">← SEMANAS</span><div id="dias-container"></div></div>
    <div id="view-exercises" class="hidden">
        <span class="back-btn" onclick="showView('days')">← VOLVER AL DÍA</span>
        <h2 id="day-title-header" style="color:var(--neon); font-size: 1.2rem;"></h2>
        <div id="ejercicios-container"></div>
        <button class="btn-main" onclick="finalizarYPropagarTotal()">Guardar Sesión</button>
    </div>

<script>
const musculos = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];

// RUTINA MAESTRA RESTAURADA SEGÚN TUS DATOS
const rutinaMaestraOriginal = [
    { n: 'Push 1', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 1', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Legs', e: [
        { name: 'Sentadilla Bulgara', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Sentadilla', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Peso Muerto Manc.', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Femoral', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Pie', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Sentado', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Push 2', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 2', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]}
];

let objetivosInic = {};
rutinaMaestraOriginal.forEach(d => d.e.forEach(ej => objetivosInic[ej.name] = 100));

let db = JSON.parse(localStorage.getItem('gymNeonV14')) || { 
    semanas: [], 
    rutinaMaestra: rutinaMaestraOriginal,
    objetivosEjercicios: objetivosInic
};

let activeW = null, activeD = null;
let radarChart, lineChart;

function save() { localStorage.setItem('gymNeonV14', JSON.stringify(db)); updateCharts(); }

function renderGoals() {
    const cont = document.getElementById('goals-list');
    let listaEjs = [...new Set(rutinaMaestraOriginal.flatMap(d => d.e.map(ej => ej.name)))];
    cont.innerHTML = listaEjs.map(ej => `
        <div class="card" style="padding:15px">
            <div style="font-size:0.75rem; margin-bottom:8px">${ej}</div>
            <input type="number" value="${db.objetivosEjercicios[ej] || 100}" onchange="db.objetivosEjercicios['${ej}'] = parseFloat(this.value)">
        </div>
    `).join('');
}

function saveGoals() { save(); alert("Objetivos Guardados"); changeView('charts'); }

function updateCharts() {
    const ctxRadar = document.getElementById('radarMusculos');
    const dataMuscular = musculos.map(m => {
        let porcentajes = [];
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(ej => {
            if(ej.m === m) {
                let maxR1M = 0;
                ej.series.forEach(ser => {
                    let r1m = ser.p * (1 + ser.r/30);
                    if(r1m > maxR1M) maxR1M = r1m;
                });
                let obj = db.objetivosEjercicios[ej.name] || 100;
                porcentajes.push((maxR1M / obj) * 100);
            }
        })));
        if(porcentajes.length === 0) return 0;
        return Math.min(porcentajes.reduce((a,b) => a+b, 0) / porcentajes.length, 100);
    });

    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctxRadar, {
        type: 'radar',
        data: { labels: musculos, datasets: [{ data: dataMuscular, backgroundColor: 'rgba(57, 255, 20, 0.2)', borderColor: '#39ff14', borderWidth: 2 }] },
        options: { scales: { r: { min: 0, max: 100, grid: { color: '#222' }, angleLines: { color: '#222' }, pointLabels: { color: '#888' }, ticks: { display: false } } }, plugins: { legend: { display: false } } }
    });

    const ctxLine = document.getElementById('lineProgress');
    const historial = { Push: [], Pull: [], Legs: [] };
    db.semanas.forEach(s => {
        s.dias.forEach(d => {
            const cat = d.n.split(' ')[0];
            if(historial[cat]) {
                let vol = 0;
                d.e.forEach(ej => ej.series.forEach(ser => vol += (ser.p * ser.r)));
                if(vol > 0) historial[cat].push(vol);
            }
        });
    });

    if(lineChart) lineChart.destroy();
    lineChart = new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: Array.from({length: 10}, (_, i) => i + 1),
            datasets: [
                { label: 'Push', data: historial.Push, borderColor: '#39ff14', tension: 0.4 },
                { label: 'Pull', data: historial.Pull, borderColor: '#00d4ff', tension: 0.4 },
                { label: 'Legs', data: historial.Legs, borderColor: '#ff0055', tension: 0.4 }
            ]
        },
        options: { scales: { y: { grid: { color: '#1a1a1a' } }, x: { grid: { display: false } } }, plugins: { legend: { labels: { color: '#888', font: { size: 10 } } } } }
    });
}

function renderEjercicios() {
    const dia = db.semanas[activeW].dias[activeD];
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card">
            <div class="ejercicio-header"><span class="ej-name">${ej.name}</span><div>
                <button class="btn-series" onclick="removeSerie(${ei})">-</button>
                <button class="btn-series" onclick="addSerie(${ei})">+</button>
            </div></div>
            <div class="serie-row"><div class="serie-label">Set</div><div class="serie-label">Kg</div><div class="serie-label">Reps</div></div>
            ${ej.series.map((s, si) => `
                <div class="serie-row">
                    <div style="color:var(--neon); font-size:0.8rem; font-weight:bold">#${si+1}</div>
                    <input type="number" step="0.5" value="${s.p}" onchange="updVal(${ei},${si},'p',this.value)">
                    <input type="number" value="${s.r}" onchange="updVal(${ei},${si},'r',this.value)">
                </div>
            `).join('')}
        </div>
    `).join('');
}

function updVal(ei, si, field, val) { db.semanas[activeW].dias[activeD].e[ei].series[si][field] = parseFloat(val) || 0; }
function addSerie(ei) { db.semanas[activeW].dias[activeD].e[ei].series.push({p:0, r:0}); renderEjercicios(); }
function removeSerie(ei) { if(db.semanas[activeW].dias[activeD].e[ei].series.length > 1) { db.semanas[activeW].dias[activeD].e[ei].series.pop(); renderEjercicios(); } }

function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const tipoDia = diaEditado.n.split(' ')[0];
    db.rutinaMaestra[activeD] = JSON.parse(JSON.stringify(diaEditado));
    for (let i = activeW; i < db.semanas.length; i++) {
        db.semanas[i].dias.forEach((d, dIdx) => {
            if (i > activeW || (i === activeW && dIdx > activeD)) {
                if (d.n.startsWith(tipoDia)) {
                    d.e.forEach(ejF => {
                        const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                        if(ejActual) ejF.series = JSON.parse(JSON.stringify(ejActual.series));
                    });
                }
            }
        });
    }
    save(); showView('days');
}

function toggleSidebar() { 
    document.getElementById('sidebar').classList.toggle('open'); 
    const over = document.getElementById('overlay');
    over.style.display = over.style.display === 'block' ? 'none' : 'block';
}
function changeView(v) { 
    showView(v); 
    if(v === 'groups') renderGroups(); 
    if(v === 'goals') renderGoals();
    toggleSidebar(); 
}
function showView(id) {
    document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden'));
    document.getElementById('view-' + id).classList.remove('hidden');
    if(id === 'charts') updateCharts();
}
function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = "";
    for(let i=0; i<nG; i++) {
        cont.innerHTML += `<div class="card" onclick="renderWInG(${i})">
            <div style="font-size:0.6rem; color:var(--neon); margin-bottom:5px">BLOQUE ${i+1}</div>
            <div style="font-weight:bold; font-size:0.9rem">Semanas ${i*12+1} - ${Math.min((i+1)*12, db.semanas.length)}</div>
        </div>`;
    }
}
function nuevaSemana() { db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) }); save(); renderGroups(); }
function renderWInG(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}
function openW(i) { activeW = i; document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card" onclick="openD(${di})">${d.n}</div>`).join(''); showView('days'); }
function openD(di) { activeD = di; document.getElementById('day-title-header').innerText = db.semanas[activeW].dias[activeD].n; renderEjercicios(); showView('exercises'); }
function resetData() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('gymNeonV14'); location.reload(); } }

updateCharts();
renderGroups();
</script>
</body>
</html>
