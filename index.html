<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Pro | Yearly Discipline</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0c; --card: #16161a; --neon: #39ff14; 
            --neon-dim: rgba(57, 255, 20, 0.15); --text: #e0e0e0; --gray: #888;
            --accent: #1f1f23; --red: #ff4444;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 80px; }
        h1, h2, h3, .logo { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }

        .header-controls { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(10,10,12,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 25px; z-index: 100; border-bottom: 1px solid #222; justify-content: space-between; }
        .menu-icon { font-size: 24px; color: var(--neon); cursor: pointer; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); z-index: 200; transition: 0.4s; border-right: 1px solid var(--neon-dim); padding: 80px 30px; }
        .sidebar.open { left: 0; }
        .sidebar-item { padding: 18px 0; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 1px solid #222; }

        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        
        /* CALENDARIO */
        .view-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-tab { flex: 1; padding: 10px; background: #1a1a1e; border: 1px solid #333; color: var(--gray); border-radius: 8px; font-size: 0.6rem; font-family: 'Orbitron'; cursor: pointer; }
        .btn-tab.active { border-color: var(--neon); color: var(--neon); background: var(--neon-dim); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; border-radius: 4px; background: #1a1a1e; color: #444; }
        
        /* VISTA ANUAL */
        .year-grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin-top: 10px; }
        .year-dot { width: 100%; aspect-ratio: 1/1; background: #1a1a1e; border-radius: 2px; }
        .dot-trained { background: var(--neon); box-shadow: 0 0 5px var(--neon-dim); }

        .day-trained { background: var(--neon) !important; color: #000 !important; font-weight: bold; }
        .day-current { border: 1px solid var(--neon); color: var(--text); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .ejercicio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .ej-name { color: var(--text); font-weight: 700; font-size: 0.9rem; }
        .serie-row { display: grid; grid-template-columns: 0.6fr 1fr 1fr; gap: 15px; margin-bottom: 12px; }
        .serie-label { font-size: 0.6rem; color: var(--gray); text-transform: uppercase; font-weight: 800; }
        input { background: var(--accent); border: 1px solid #333; border-radius: 6px; color: var(--neon); text-align: center; font-size: 1rem; padding: 8px; outline: none; width: 100%; }
        .btn-series { background: #222; border: 1px solid #444; color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
        .btn-main { width: 100%; background: var(--neon); border: none; color: #000; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-family: 'Orbitron'; }
        .hidden { display: none; }
        .back-btn { color: var(--gray); cursor: pointer; margin-bottom: 25px; display: inline-block; font-size: 0.8rem; font-weight: 700; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; display: none; }
        canvas { background: rgba(255,255,255,0.02); border-radius: 12px; padding: 10px; margin-bottom: 40px; width: 100% !important; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <div class="logo" style="color:var(--neon); font-size: 0.9rem;">SYMMETRY PRO</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="changeView('charts')">📊 Estadísticas</div>
        <div class="sidebar-item" onclick="changeView('calendar')">📅 Disciplina</div>
        <div class="sidebar-item" onclick="changeView('groups')">💪 Mi Rutina</div>
        <div class="sidebar-item" onclick="changeView('goals')">🎯 Objetivos</div>
        <div class="sidebar-item" onclick="resetData()" style="color:var(--red); margin-top: 20px;">⚠ Reset</div>
    </div>

    <div id="view-calendar" class="hidden">
        <h2>Disciplina</h2>
        <div class="view-selector">
            <button id="btn-month" class="btn-tab active" onclick="setCalView('month')">MES</button>
            <button id="btn-year" class="btn-tab" onclick="setCalView('year')">AÑO COMPLETO</button>
        </div>

        <div id="cal-month-box" class="card">
            <div class="calendar-header">
                <button class="btn-series" onclick="changeMonth(-1)">‹</button>
                <div id="monthLabel" style="font-family:'Orbitron'; color:var(--neon); font-size:0.8rem;"></div>
                <button class="btn-series" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div id="cal-year-box" class="card hidden">
            <div style="font-family:'Orbitron'; color:var(--neon); font-size:0.8rem; margin-bottom:15px;" id="yearLabel"></div>
            <div class="year-grid" id="yearGrid"></div>
            <p style="font-size:0.5rem; color:var(--gray); margin-top:15px;">Cada cuadro representa un día del año actual.</p>
        </div>
    </div>

    <div id="view-charts">
        <canvas id="radarMusculos"></canvas>
        <canvas id="lineProgress"></canvas>
    </div>

    <div id="view-goals" class="hidden"><h2>Objetivos</h2><div id="goals-list"></div><button class="btn-main" onclick="saveGoals()">Guardar</button></div>
    <div id="view-groups" class="hidden"><h2>Bloques</h2><div id="groups-container"></div><button class="btn-main" onclick="nuevaSemana()">+ Nueva Semana</button></div>
    <div id="view-weeks" class="hidden"><span class="back-btn" onclick="showView('groups')">← VOLVER</span><div id="semanas-container"></div></div>
    <div id="view-days" class="hidden"><span class="back-btn" onclick="showView('weeks')">← VOLVER</span><div id="dias-container"></div></div>
    <div id="view-exercises" class="hidden"><span class="back-btn" onclick="showView('days')">← VOLVER</span><h2 id="day-title-header"></h2><div id="ejercicios-container"></div><button class="btn-main" onclick="finalizarYPropagarTotal()">Guardar Sesión</button></div>

<script>
const musculos = ['Pecho', 'Espalda', 'Pierna', 'Hombro', 'Biceps', 'Triceps'];
let currentCalDate = new Date();
let currentCalView = 'month';

const rutinaMaestraOriginal = [
    { n: 'Push 1', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 1', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Legs', e: [
        { name: 'Sentadilla Bulgara', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Sentadilla', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Peso Muerto Manc.', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Femoral', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Pie', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Gemelos Sentado', m: 'Pierna', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Push 2', e: [
        { name: 'Press Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Aperturas Inclinado', m: 'Pecho', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Biceps Inclinado', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Curl Martillo', m: 'Biceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Laterales', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Militar', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]},
    { n: 'Pull 2', e: [
        { name: 'Dominadas', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Remo Unilateral', m: 'Espalda', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Elevaciones Posteriores', m: 'Hombro', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Cerrado', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Press Frances', m: 'Triceps', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] },
        { name: 'Dragon Flags', m: 'Core', series: [{p:0,r:0},{p:0,r:0},{p:0,r:0}] }
    ]}
];

let db = JSON.parse(localStorage.getItem('gymNeonV18')) || { 
    semanas: [], rutinaMaestra: rutinaMaestraOriginal, objetivosEjercicios: {}, fechasEntreno: [] 
};

let activeW = null, activeD = null;
let radarChart, lineChart;

function save() { localStorage.setItem('gymNeonV18', JSON.stringify(db)); updateCharts(); renderCalendar(); }

function setCalView(v) {
    currentCalView = v;
    document.getElementById('btn-month').classList.toggle('active', v === 'month');
    document.getElementById('btn-year').classList.toggle('active', v === 'year');
    document.getElementById('cal-month-box').classList.toggle('hidden', v !== 'month');
    document.getElementById('cal-year-box').classList.toggle('hidden', v !== 'year');
    renderCalendar();
}

function renderCalendar() {
    if(currentCalView === 'month') {
        const grid = document.getElementById('calendarGrid');
        const label = document.getElementById('monthLabel');
        grid.innerHTML = "";
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const monthNames = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
        label.innerText = `${monthNames[month]} ${year}`;
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        let startDay = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startDay; i++) grid.innerHTML += `<div></div>`;
        const hoyStr = new Date().toISOString().split('T')[0];
        for(let d=1; d<=daysInMonth; d++) {
            const dStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isTrained = db.fechasEntreno.includes(dStr);
            grid.innerHTML += `<div class="calendar-day ${isTrained ? 'day-trained' : ''} ${dStr === hoyStr ? 'day-current' : ''}">${d}</div>`;
        }
    } else {
        const yearGrid = document.getElementById('yearGrid');
        const yLabel = document.getElementById('yearLabel');
        yearGrid.innerHTML = "";
        const year = new Date().getFullYear();
        yLabel.innerText = `AÑO ${year}`;
        
        // Generar 365/366 días
        let d = new Date(year, 0, 1);
        while(d.getFullYear() === year) {
            const dStr = d.toISOString().split('T')[0];
            const isTrained = db.fechasEntreno.includes(dStr);
            yearGrid.innerHTML += `<div class="year-dot ${isTrained ? 'dot-trained' : ''}"></div>`;
            d.setDate(d.getDate() + 1);
        }
    }
}

function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); renderCalendar(); }

// ... (Todas las funciones previas de sincronización y gráficas se mantienen IDÉNTICAS)
function finalizarYPropagarTotal() {
    const diaEditado = db.semanas[activeW].dias[activeD];
    const prefijoDia = diaEditado.n.split(' ')[0]; 
    db.rutinaMaestra[activeD] = JSON.parse(JSON.stringify(diaEditado));
    const hoy = new Date().toISOString().split('T')[0];
    if(!db.fechasEntreno.includes(hoy)) db.fechasEntreno.push(hoy);
    db.semanas.forEach((sem, sIdx) => {
        sem.dias.forEach((dia) => {
            if (dia.n.startsWith(prefijoDia)) {
                if (sIdx >= activeW) {
                   dia.e.forEach(ejF => {
                        const ejActual = diaEditado.e.find(ex => ex.name === ejF.name);
                        if(ejActual) ejF.series = JSON.parse(JSON.stringify(ejActual.series));
                   });
                }
            }
        });
    });
    save(); showView('days');
}

function updateCharts() {
    const ctxRadar = document.getElementById('radarMusculos');
    const dataMuscular = musculos.map(m => {
        let porcentajes = [];
        db.semanas.forEach(s => s.dias.forEach(d => d.e.forEach(ej => {
            if(ej.m === m) {
                let maxR1M = 0;
                ej.series.forEach(ser => { let r1m = ser.p * (1 + ser.r/30); if(r1m > maxR1M) maxR1M = r1m; });
                let obj = db.objetivosEjercicios[ej.name] || 100;
                porcentajes.push((maxR1M / obj) * 100);
            }
        })));
        if(porcentajes.length === 0) return 0;
        return Math.min(porcentajes.reduce((a,b) => a+b, 0) / porcentajes.length, 100);
    });
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctxRadar, { type: 'radar', data: { labels: musculos, datasets: [{ data: dataMuscular, backgroundColor: 'rgba(57, 255, 20, 0.2)', borderColor: '#39ff14', borderWidth: 2 }] }, options: { scales: { r: { min: 0, max: 100, grid: { color: '#222' }, angleLines: { color: '#222' }, pointLabels: { color: '#888' }, ticks: { display: false } } }, plugins: { legend: { display: false } } } });

    const ctxLine = document.getElementById('lineProgress');
    const hist = { Push: [], Pull: [], Legs: [] };
    db.semanas.forEach(s => s.dias.forEach(d => {
        const cat = d.n.split(' ')[0];
        if(hist[cat]) {
            let v = 0; d.e.forEach(ej => ej.series.forEach(ser => v += (ser.p * ser.r)));
            if(v > 0) hist[cat].push(v);
        }
    }));
    if(lineChart) lineChart.destroy();
    lineChart = new Chart(ctxLine, { type: 'line', data: { labels: Array.from({length: 10}, (_, i) => i + 1), datasets: [{ label: 'Push', data: hist.Push.slice(-10), borderColor: '#39ff14' }, { label: 'Pull', data: hist.Pull.slice(-10), borderColor: '#00d4ff' }, { label: 'Legs', data: hist.Legs.slice(-10), borderColor: '#ff0055' }] }, options: { scales: { y: { grid: { color: '#1a1a1a' } }, x: { display: false } }, plugins: { legend: { labels: { color: '#888', font: { size: 10 } } } } } });
}

function renderEjercicios() {
    const dia = db.semanas[activeW].dias[activeD];
    document.getElementById('ejercicios-container').innerHTML = dia.e.map((ej, ei) => `
        <div class="card">
            <div class="ejercicio-header"><span class="ej-name">${ej.name}</span><div><button class="btn-series" onclick="removeSerie(${ei})">-</button><button class="btn-series" onclick="addSerie(${ei})">+</button></div></div>
            <div class="serie-row"><div class="serie-label">Set</div><div class="serie-label">Kg</div><div class="serie-label">Reps</div></div>
            ${ej.series.map((s, si) => `<div class="serie-row"><div style="color:var(--neon); font-size:0.8rem; font-weight:bold">#${si+1}</div><input type="number" step="0.5" value="${s.p}" onchange="updVal(${ei},${si},'p',this.value)"><input type="number" value="${s.r}" onchange="updVal(${ei},${si},'r',this.value)"></div>`).join('')}
        </div>
    `).join('');
}
function updVal(ei, si, f, v) { db.semanas[activeW].dias[activeD].e[ei].series[si][f] = parseFloat(v) || 0; }
function addSerie(ei) { db.semanas[activeW].dias[activeD].e[ei].series.push({p:0, r:0}); renderEjercicios(); }
function removeSerie(ei) { if(db.semanas[activeW].dias[activeD].e[ei].series.length > 1) { db.semanas[activeW].dias[activeD].e[ei].series.pop(); renderEjercicios(); } }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); const over = document.getElementById('overlay'); over.style.display = over.style.display === 'block' ? 'none' : 'block'; }
function changeView(v) { showView(v); if(v === 'groups') renderGroups(); if(v === 'goals') renderGoals(); if(v === 'calendar') renderCalendar(); toggleSidebar(); }
function showView(id) { document.querySelectorAll('body > div:not(.header-controls):not(.sidebar):not(.overlay)').forEach(d => d.classList.add('hidden')); document.getElementById('view-' + id).classList.remove('hidden'); if(id === 'charts') updateCharts(); }
function renderGroups() {
    const cont = document.getElementById('groups-container');
    const nG = Math.ceil(db.semanas.length / 12);
    cont.innerHTML = "";
    for(let i=0; i<nG; i++) { cont.innerHTML += `<div class="card" onclick="renderWInG(${i})"><div style="font-size:0.6rem; color:var(--neon); margin-bottom:5px">BLOQUE ${i+1}</div><div style="font-weight:bold; font-size:0.9rem">Semanas ${i*12+1} - ${Math.min((i+1)*12, db.semanas.length)}</div></div>`; }
}
function nuevaSemana() { db.semanas.push({ id: db.semanas.length + 1, dias: JSON.parse(JSON.stringify(db.rutinaMaestra)) }); save(); renderGroups(); }
function renderWInG(gi) {
    const start = gi*12, end = Math.min(start+12, db.semanas.length);
    let h = "";
    for(let i=start; i<end; i++) h += `<div class="card" onclick="openW(${i})">Semana ${db.semanas[i].id}</div>`;
    document.getElementById('semanas-container').innerHTML = h;
    showView('weeks');
}
function openW(i) { activeW = i; document.getElementById('dias-container').innerHTML = db.semanas[i].dias.map((d, di) => `<div class="card" onclick="openD(${di})">${d.n}</div>`).join(''); showView('days'); }
function openD(di) { activeD = di; document.getElementById('day-title-header').innerText = db.semanas[activeW].dias[activeD].n; renderEjercicios(); showView('exercises'); }
function resetData() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('gymNeonV18'); location.reload(); } }

updateCharts();
renderGroups();
renderCalendar();
</script>
</body>
</html>
